<script>
/* =====================================================================
 * MetroRuma · panorama, proveedores y detalle
 *
 * Pintado de las mediciones, la lista de ataque, las tablas y la ficha
 * lateral del proveedor.
 * ===================================================================== */

/* =====================================================================
 * PINTADO
 * ===================================================================== */

function renderAll() {
  if (!DATA) { return; }

  ROWS = filteredRows();
  SUMMARY = buildSummary(filteredRows(true));
  WEEKS = buildWeeks(filteredRows(true), SUMMARY);

  renderGauges();
  renderAttack();
  renderProviderTable();
  renderForestal();
  renderDetail();
  renderHealth();
  renderWeekOptions();
  renderWeekView();
  redrawCharts();

  if (VIEW !== 'panorama') { drawRuma(); }
}

function renderReadout(model) {
  var host = id('rumaReadout');

  if (!model) { host.innerHTML = ''; return; }

  var gap = model.total - model.planToDate;
  var remaining = model.wd.remaining || 0;
  var need = remaining > 0
    ? Math.max(0, model.plan - model.total) / remaining
    : null;

  var effort = (need !== null && model.pace > 0) ? need / model.pace : null;

  var cells = [
    {
      key: 'Recibido a la fecha',
      value: fmt(model.total),
      unit: 'MR',
      note: model.plan > 0
        ? pctText(model.total / model.plan) + ' del plan del mes'
        : 'Sin plan cargado'
    },
    {
      key: 'Desvío a la fecha',
      value: signed(gap),
      unit: 'MR',
      tone: gap >= 0 ? 'over' : (gap > -model.planToDate * 0.1 ? 'warn' : 'crit'),
      note: gap >= 0 ? 'Por delante del plan diario' : 'Por detrás del plan diario'
    },
    {
      key: 'Cierre proyectado',
      value: fmt(model.projection),
      unit: 'MR',
      tone: model.plan > 0
        ? (model.projection >= model.plan ? 'over' : 'crit')
        : null,
      note: model.plan > 0
        ? pctText(model.projection / model.plan) + ' · ' +
          signed(model.projection - model.plan) + ' MR vs plan'
        : 'Sin plan para comparar'
    },
    {
      key: 'Ritmo exigido',
      value: need === null ? '—' : fmt(need),
      unit: 'MR/día',
      tone: effort !== null && effort > 1.15 ? 'warn' : null,
      note: need === null
        ? 'No quedan días hábiles'
        : (effort === null
            ? 'Ritmo actual sin referencia'
            : 'Ritmo actual ' + fmt(model.pace) + ' MR/día · ×' +
              effort.toFixed(2) + ' de esfuerzo')
    }
  ];

  host.innerHTML = cells.map(function(cell) {
    return '<div class="readout">' +
      '<div class="readout-key">' + esc(cell.key) + '</div>' +
      '<div class="readout-value num' +
        (cell.tone ? ' is-' + cell.tone : '') + '">' +
        esc(cell.value) +
        '<span class="readout-unit">' + esc(cell.unit) + '</span>' +
      '</div>' +
      '<div class="readout-note">' + esc(cell.note) + '</div>' +
    '</div>';
  }).join('');
}

/**
 * Superficie de diagnóstico del mes.
 *
 * No repite la lectura de la ruma. La ruma y su lectura contestan *dónde
 * está el mes* (recibido, desvío, cierre proyectado, ritmo exigido) y son
 * lo primero que se lee. Esta superficie contesta lo otro: *qué hacer al
 * respecto*. Antes traía las mismas cuatro cifras 200 px más abajo y en
 * tipografía más grande que la lectura de la ruma, así que la pantalla
 * decía dos veces lo mismo y no tenía dónde caer la vista.
 */
function renderGauges() {
  var wd = workdays();
  var daily = buildDaily(ROWS).filter(function(point) { return point.elapsed; });
  var plan = sum(SUMMARY, 'plan');
  var total = sum(SUMMARY, 'actual') + sum(SUMMARY, 'gmail');
  var pace = wd.elapsed > 0 ? total / wd.elapsed : 0;
  var risk = sum(SUMMARY, 'risk');

  var need = wd.remaining > 0
    ? Math.max(0, plan - total) / wd.remaining
    : null;

  var received = SUMMARY.map(function(item) { return item.total; });
  var core = headcountFor(received, 0.8);

  var idle = SUMMARY.filter(function(item) {
    return item.plan > 0 && item.idleDays >= 3;
  });

  var below = SUMMARY.filter(function(item) {
    return item.band === 'warn' || item.band === 'crit';
  });

  // Tendencia del ritmo: últimos cinco días hábiles contra los anteriores.
  // Es lo que la chispa ya dibujaba y nadie leía.
  var trend = null;

  if (daily.length >= 6) {
    var tail = daily.slice(-5);
    var head = daily.slice(0, -5);

    var tailPace = tail.reduce(function(acc, point) {
      return acc + point.total;
    }, 0) / tail.length;

    var headPace = head.reduce(function(acc, point) {
      return acc + point.total;
    }, 0) / head.length;

    if (headPace > 0) { trend = tailPace / headPace - 1; }
  }

  var cells = [
    {
      key: 'MR en riesgo',
      value: fmt(risk),
      tone: risk > 0 ? 'crit' : 'over',
      note: risk > 0
        ? 'del plan del mes si nadie cambia el ritmo'
        : 'Ningún proveedor cierra bajo su plan',
      hint: 'Suma, proveedor por proveedor, de lo que le falta para su plan ' +
        'si mantiene el ritmo que lleva. Es la cifra que ordena la lista de ' +
        'ataque.'
    },
    {
      key: 'Ritmo diario',
      value: fmt(pace),
      note: trend === null
        ? (need === null
            ? 'MR por día hábil · no quedan días'
            : 'MR por día hábil')
        : (trend >= 0.03
            ? 'subiendo ' + pctText(trend) + ' en los últimos 5 días'
            : (trend <= -0.03
                ? 'cayendo ' + pctText(Math.abs(trend)) + ' en los últimos 5 días'
                : 'parejo en los últimos 5 días')),
      tone: trend !== null && trend <= -0.1 ? 'warn' : null,
      // Sin chispa: la nota ya dice la tendencia con palabras, y la serie
      // completa está dibujada en "Recepción diaria". Una sola celda con
      // gráfico desequilibraba la banda sin agregar nada.
      hint: 'Recibido ÷ días hábiles transcurridos. La comparación es contra ' +
        'los días hábiles anteriores del mismo mes: dice si el mes se está ' +
        'acelerando o apagando. El ritmo que exige el plan está en la ' +
        'lectura de la ruma.'
    },
    {
      key: 'Bajo plan',
      value: String(below.length),
      tone: below.length > 0 ? 'warn' : null,
      note: 'de ' + SUMMARY.length + ' proveedores con movimiento',
      hint: 'Proveedores bajo el 95% de su plan a la fecha.'
    },
    {
      key: 'Sin recibir',
      value: String(idle.length),
      tone: idle.length > 0 ? 'warn' : null,
      note: idle.length
        ? fmt(sum(idle, 'plan')) + ' MR de plan detenidos'
        : 'Todos entregaron esta semana',
      hint: 'Proveedores con plan que llevan 3 días hábiles o más sin ' +
        'recepción. Detecta al que se detuvo antes de que el mes lo muestre.'
    },
    {
      key: 'Concentración',
      value: core === null
        ? '—'
        : core + (core === 1 ? ' nombre' : ' nombres'),
      note: core === null
        ? 'Sin proveedores para comparar'
        : 'hacen el 80% de lo recibido',
      hint: 'Cuántos proveedores, de mayor a menor, explican el 80% del ' +
        'abastecimiento. Si son dos o tres, el mes depende de esos llamados.'
    }
  ];

  id('gauges').innerHTML = gaugeMarkup(cells);
}

/**
 * Una sola superficie de mediciones, dividida por filetes de 1px. La usan
 * el panorama y la vista forestal.
 */
function gaugeMarkup(cells) {
  return cells.map(function(cell, index) {
    return '<div class="gauge" style="--i:' + index + '">' +
      '<div class="gauge-key">' + esc(cell.key) +
        (cell.hint
          ? '<span class="hint" title="' + esc(cell.hint) + '">?</span>'
          : '') +
      '</div>' +
      '<div class="gauge-value num' +
        (cell.tone ? ' is-' + cell.tone : '') + '">' + esc(cell.value) + '</div>' +
      '<div class="gauge-note">' + esc(cell.note) + '</div>' +
    '</div>';
  }).join('');
}

function renderAttack() {
  var host = id('attackList');
  var wd = workdays();

  var rows = SUMMARY
    .filter(function(item) {
      return item.plan > 0 && (item.risk > 0 || item.idleDays >= 3);
    })
    .slice(0, 8);

  id('badgeRisk').textContent = String(rows.length);
  id('badgeRisk').hidden = rows.length === 0;

  if (!rows.length) {
    host.innerHTML =
      '<div class="attack-empty">Ningún proveedor proyecta cerrar bajo ' +
      'su plan. Mantén el seguimiento semanal.</div>';
    return;
  }

  host.innerHTML = rows.map(function(item, index) {
    var reasons = [];

    if (item.risk > 0) {
      reasons.push(
        'proyecta ' + fmt(item.projection) + ' de ' + fmt(item.plan) + ' MR'
      );
    }

    if (item.idleDays >= 3) {
      reasons.push('sin recibir hace ' + item.idleDays + ' días hábiles');
    }

    if (item.requiredPace !== null && item.effort !== null && item.effort > 1.1) {
      reasons.push(
        'necesita ' + fmt(item.requiredPace) + ' MR/día, ×' +
        item.effort.toFixed(1) + ' su ritmo'
      );
    } else if (item.requiredPace !== null && item.requiredPace > 0) {
      reasons.push('necesita ' + fmt(item.requiredPace) + ' MR/día');
    }

    return '<div class="attack-item" style="--i:' + index + '">' +
      '<span class="attack-rank">' + pad2(index + 1) + '</span>' +
      '<button type="button" class="attack-name" data-act="ficha" ' +
        'data-provider="' + esc(item.provider) + '">' +
        esc(item.provider) +
      '</button>' +
      '<span class="attack-loss">' + fmt(item.risk) + ' MR</span>' +
      '<p class="attack-why">' + esc(cap(reasons.join(' · '))) + '</p>' +
      '<button type="button" class="attack-note" data-act="apunte" ' +
        'data-provider="' + esc(item.provider) + '">Escribir apunte</button>' +
    '</div>';
  }).join('');

  each('#attackList [data-act]', function(node) {
    node.addEventListener('click', function() {
      if (node.dataset.act === 'apunte') {
        goToNote(node.dataset.provider);
      } else {
        openDrawer(node.dataset.provider, node);
      }
    });
  });
}

function renderProviderTable() {
  var body = id('providerBody');
  var foot = id('providerFoot');

  id('providerCount').textContent =
    SUMMARY.length + (SUMMARY.length === 1 ? ' proveedor' : ' proveedores');

  each('#providerTable th.sortable', function(th) {
    if (th.dataset.sort === SORT.key) {
      th.setAttribute('aria-sort', SORT.dir === 'asc' ? 'ascending' : 'descending');
    } else {
      th.removeAttribute('aria-sort');
    }
  });

  if (!SUMMARY.length) {
    body.innerHTML = '<tr class="empty"><td colspan="12">' +
      'No hay proveedores para el filtro seleccionado.</td></tr>';
    foot.innerHTML = '';
    return;
  }

  var rows = SUMMARY.slice().sort(function(a, b) {
    var key = SORT.key;
    var dir = SORT.dir === 'asc' ? 1 : -1;

    if (key === 'provider') {
      return dir * a.provider.localeCompare(b.provider, 'es', {
        sensitivity: 'base'
      });
    }

    var av = a[key] === null ? -Infinity : a[key];
    var bv = b[key] === null ? -Infinity : b[key];

    return dir * (av - bv);
  });

  body.innerHTML = rows.map(function(item) {
    return '<tr data-provider="' + esc(item.provider) + '"' +
      (PICKED === item.provider ? ' class="is-picked"' : '') + '>' +
      '<td class="name">' +
        '<button type="button" class="linkish" data-provider="' +
          esc(item.provider) + '">' + esc(item.provider) + '</button> ' +
        tagFor(item.band) +
      '</td>' +
      cell(fmt(item.plan)) +
      cell(fmt(item.planToDate)) +
      cell(fmt(item.actual)) +
      cell(fmt(item.gmail)) +
      cell('<b>' + fmt(item.total) + '</b>') +
      cell(signed(item.gapToDate), item.gapToDate >= 0 ? 'pos' : 'neg') +
      '<td class="n"><div class="cell-stack">' +
        '<span class="' + (item.complianceToDate === null ? 'dim' : '') + '">' +
          (item.complianceToDate === null
            ? 'sin plan' : pctText(item.complianceToDate)) +
        '</span>' + meter(item.complianceToDate, item.band) +
      '</div></td>' +
      cell(fmt(item.projection),
        item.plan > 0 && item.projection < item.plan ? 'neg' : 'pos') +
      cell(item.risk > 0 ? fmt(item.risk) : '—',
        item.risk > 0 ? 'neg' : 'dim') +
      cell(item.plan > 0 ? String(item.idleDays) : '—',
        item.idleDays >= 3 ? 'neg' : 'dim') +
      '<td>' + trendCell(item.provider) + '</td>' +
    '</tr>';
  }).join('');

  var totals = SUMMARY.reduce(function(acc, item) {
    ['plan', 'planToDate', 'actual', 'gmail', 'total', 'projection', 'risk']
      .forEach(function(key) { acc[key] += item[key]; });
    return acc;
  }, {
    plan: 0, planToDate: 0, actual: 0, gmail: 0,
    total: 0, projection: 0, risk: 0
  });

  var gap = totals.total - totals.planToDate;

  foot.innerHTML = '<tr>' +
    '<td>Total</td>' +
    cell(fmt(totals.plan)) +
    cell(fmt(totals.planToDate)) +
    cell(fmt(totals.actual)) +
    cell(fmt(totals.gmail)) +
    cell(fmt(totals.total)) +
    cell(signed(gap), gap >= 0 ? 'pos' : 'neg') +
    cell(totals.planToDate > 0
      ? pctText(totals.total / totals.planToDate) : '—') +
    cell(fmt(totals.projection)) +
    cell(totals.risk > 0 ? fmt(totals.risk) : '—',
      totals.risk > 0 ? 'neg' : 'dim') +
    cell('') +
    '<td></td>' +
  '</tr>';

  each('#providerBody tr[data-provider]', function(row) {
    var handle = row.querySelector('.linkish');

    row.addEventListener('click', function() {
      openDrawer(row.dataset.provider, handle);
    });

    handle.addEventListener('click', function(event) {
      event.stopPropagation();
      openDrawer(row.dataset.provider, handle);
    });
  });
}

/**
 * Una casilla por semana con el color del cumplimiento: distingue de un
 * vistazo al proveedor que falla siempre del que falló una vez.
 */
function trendCell(provider) {
  var blocks = WEEKS.map(function(week) {
    var line = week.lines.filter(function(row) {
      return row.provider === provider;
    })[0];

    if (!line || line.plan <= 0) {
      return '<i class="trend-block is-void" title="' +
        esc(week.label) + ': sin plan"></i>';
    }

    var colors = heatColor(line.compliance);

    return '<i class="trend-block" style="background:' + colors[0] +
      '" title="' + esc(week.label) + ': ' +
      Math.round(line.compliance * 100) + '% · ' +
      fmt(line.received) + ' de ' + fmt(line.plan) + ' MR"></i>';
  }).join('');

  return blocks
    ? '<span class="trend" role="img" aria-label="Cumplimiento semana a semana">' +
      blocks + '</span>'
    : '<span class="dim">—</span>';
}

function cell(html, className) {
  return '<td class="n' + (className ? ' ' + className : '') + '">' +
    html + '</td>';
}

function meter(compliance, bandKey) {
  if (compliance === null) { return ''; }

  var width = Math.max(2, Math.min(100, compliance * 100 * 0.66));

  return '<span class="meter">' +
    '<span class="meter-fill" style="width:' + width + '%;background:' +
      (BAND_COLOR[bandKey] || PALETTE.line2) + '"></span>' +
    '<span class="meter-mark" style="left:66%"></span>' +
  '</span>';
}

function tagFor(bandKey) {
  var cls = {
    over: 'tag-over', ok: 'tag-ok',
    warn: 'tag-warn', crit: 'tag-crit', void: 'tag-ok'
  };

  return '<span class="tag ' + (cls[bandKey] || 'tag-ok') + '">' +
    esc(BAND_LABEL[bandKey] || '') + '</span>';
}

var DETAIL_PAGE = 300;

/* =====================================================================
 * FORESTAL
 * ===================================================================== */

/**
 * Mediciones del origen del suministro. No repiten las del panorama: aquí
 * interesa de dónde viene el metro ruma y qué tan frágil es esa fuente.
 */
function renderForestalGauges() {
  var host = id('gaugesForestal');

  if (!host) { return; }

  var wd = workdays();
  var product = buildProductMix(ROWS);
  var estates = buildEstateMix(ROWS);
  var status = buildStatusMix(ROWS);
  var autonomy = buildAutonomy(SUMMARY);
  var portfolio = buildPortfolio(SUMMARY);

  var received = SUMMARY.map(function(item) { return item.total; });
  var concentration = herfindahl(received);
  var core = headcountFor(received, 0.8);

  var top = product.list[0];

  var red = status.slices.filter(function(slice) {
    return slice.estatus === 'ROJO';
  })[0];

  var replace = portfolio.filter(function(item) {
    return item.zone === 'replace';
  });

  var lumpy = SUMMARY.filter(function(item) {
    return item.variability !== null && item.variability > 0.8;
  });

  var cells = [
    {
      key: 'Autonomía del mes',
      value: autonomy.ratio === null
        ? (autonomy.missing > 0 ? 'Sin ritmo' : 'Cumplido')
        : dec(autonomy.ratio) + '×',
      tone: autonomy.ratio === null
        ? (autonomy.missing > 0 ? 'crit' : 'over')
        : (autonomy.ratio >= 1 ? 'over' : 'crit'),
      note: autonomy.daysNeeded === null
        ? (autonomy.missing > 0
            ? 'Faltan ' + fmt(autonomy.missing) + ' MR y no hay ritmo'
            : 'El plan ya está cubierto')
        : 'Cerrar exige ' + dec(autonomy.daysNeeded) + ' días hábiles y ' +
          'quedan ' + autonomy.daysLeft,
      hint: 'Días hábiles que quedan ÷ días que tomaría cerrar la brecha al ' +
        'ritmo actual. Bajo 1× el mes no cierra sin cambiar algo.'
    },
    {
      key: 'Frentes activos',
      value: String(estates.active),
      tone: estates.stalled.length ? 'warn' : null,
      note: estates.stalled.length
        ? estates.stalled.length + ' detenidos sobre su propia cadencia'
        : 'predios con movimiento, ninguno detenido',
      hint: 'Predios distintos que movieron material en el período ' +
        'filtrado. Detenido es el que lleva más del doble de su cadencia ' +
        'habitual sin entregar. Solo cuenta Ingresos: el informe diario ' +
        'no trae predio.'
    },
    {
      key: 'Concentración',
      value: core === null
        ? '—'
        : core + (core === 1 ? ' nombre' : ' nombres'),
      tone: concentration !== null && concentration > 0.25 ? 'warn' : null,
      note: core === null
        ? 'Sin proveedores para comparar'
        : 'hacen el 80% del suministro · Herfindahl ' + dec(concentration),
      hint: 'Cuántos proveedores, de mayor a menor, explican el 80% de lo ' +
        'recibido. Si son dos o tres, el mes depende de esos llamados. El ' +
        'Herfindahl normalizado (0 repartido, 1 un solo nombre) sirve para ' +
        'comparar un mes con otro.'
    },
    {
      key: 'Producto principal',
      value: top ? pctText(top.share) : '—',
      note: top
        ? clip(cap(top.label.toLowerCase()), 34)
        : 'Sin producto en las filas del filtro',
      hint: 'Participación del producto más comprado sobre el volumen que ' +
        'trae material. El complemento Gmail no lo detalla.'
    },
    {
      key: 'Declaran en rojo',
      value: red ? pctText(red.share) : (status.total ? '0%' : '—'),
      tone: red && red.share > 0.2 ? 'crit' : (red ? 'warn' : null),
      note: status.total
        ? 'de ' + fmtInt(status.total) + ' declaraciones del informe'
        : 'Ninguna fila del filtro trae estatus',
      hint: 'El proveedor se declara en rojo en su informe antes de que el ' +
        'volumen caiga: sirve para llamar hoy y no la semana que viene.'
    },
    {
      key: 'Fuera de alcance',
      value: String(replace.length),
      tone: replace.length ? 'crit' : null,
      note: replace.length
        ? fmt(sum(replace, 'risk')) + ' MR que hay que buscar en otra parte'
        : 'Todo el riesgo es recuperable empujando',
      hint: 'Proveedores a los que el ritmo que les falta les exige más de ' +
        'una vez y media su mejor día del mes. No es un problema de ' +
        'llamarlos: no tienen esa capacidad.'
    },
    {
      key: 'Entregas a golpes',
      value: String(lumpy.length),
      tone: lumpy.length ? 'warn' : null,
      note: lumpy.length
        ? 'de ' + SUMMARY.length + ' proveedores entregan irregular'
        : 'Las entregas vienen parejas',
      hint: 'Proveedores cuya desviación diaria supera el 80% de su propio ' +
        'promedio. Suele ser un problema de camiones, no de bosque.'
    },
    {
      key: 'Predio principal',
      value: estates.list.length ? pctText(estates.list[0].share) : '—',
      note: estates.list.length
        ? clip(cap(estates.list[0].predio.toLowerCase()), 34)
        : 'Sin predio en las filas del filtro',
      hint: 'Cuánto del suministro con predio identificado sale de un solo ' +
        'frente de cosecha.'
    },
    {
      key: 'Sin desglose',
      value: product.total > 0
        ? pctText(product.complement / product.total)
        : '—',
      note: product.complement > 0
        ? fmt(product.complement) + ' MR del complemento Gmail'
        : 'Todo el volumen trae material',
      hint: 'Parte del volumen que llega por el informe diario, que no ' +
        'detalla material ni predio. Es la ceguera del mes.'
    }
  ];

  host.innerHTML = gaugeMarkup(cells);
}

/**
 * Tabla de decisión: qué hacer con cada proveedor y con qué ritmo.
 */
function renderForestal() {
  renderForestalGauges();

  var body = id('forestalBody');

  if (!body) { return; }

  var status = buildStatusMix(ROWS);

  // Orden de decisión, no de tamaño. Ordenada por riesgo, la tabla ponía
  // arriba justo a los proveedores con los que no se puede hacer nada y
  // enterraba abajo los llamados que sí valen la pena. Primero lo que se
  // recupera hoy, después lo que exige mover camiones, después lo que hay
  // que comprar en otra parte, y al final los que ya cierran.
  var ZONE_ORDER = { nudge: 0, push: 1, replace: 2, safe: 3 };

  var rows = buildPortfolio(SUMMARY).slice().sort(function(a, b) {
    return (ZONE_ORDER[a.zone] - ZONE_ORDER[b.zone]) || (b.risk - a.risk);
  });

  id('forestalCount').textContent =
    fmtInt(rows.length) + ' proveedores con plan';

  if (!rows.length) {
    body.innerHTML = '<tr class="empty"><td colspan="10">Ningún proveedor ' +
      'con plan en el filtro seleccionado.</td></tr>';
    return;
  }

  // El mapa evita recorrer SUMMARY por cada fila.
  var byProvider = {};

  SUMMARY.forEach(function(entry) {
    byProvider[entry.provider] = entry;
  });

  body.innerHTML = rows.map(function(item) {
    var declared = status.latest[item.provider];
    var entry = byProvider[item.provider];
    var variability = entry ? entry.variability : null;
    var lumpy = variability !== null && variability > 0.8;

    return '<tr data-provider="' + esc(item.provider) + '">' +
      '<td class="name">' +
        '<button type="button" class="linkish" data-provider="' +

        item.risk > 0 ? 'neg' : 'dim') +

      cell(item.requiredPace === null ? '—' : fmt(item.requiredPace),
        item.requiredPace === null ? 'dim' : '') +
      cell(
        item.realEffort === null
          ? '—'
          : (item.effortCapped ? '&gt;4×' : dec(item.realEffort) + '×'),
        item.zone === 'replace' ? 'neg' : (item.zone === 'push' ? 'warn' : '')

function renderDetail() {
  var body = id('detailBody');
  var dir = DETAIL_SORT.dir === 'asc' ? 1 : -1;
  var key = DETAIL_SORT.key;

  var rows = ROWS.slice().sort(function(a, b) {
    var av = a[key];
    var bv = b[key];

    if (typeof av === 'number' || typeof bv === 'number') {
      return dir * ((Number(av) || 0) - (Number(bv) || 0));
    }

    var compare = String(av || '').localeCompare(
      String(bv || ''), 'es', { sensitivity: 'base' }
    );

    return dir * (compare || a.provider.localeCompare(b.provider, 'es'));
  });

  each('#detailTable th[data-sort]', function(th) {
    if (th.dataset.sort === key) {
      th.setAttribute(
        'aria-sort', DETAIL_SORT.dir === 'asc' ? 'ascending' : 'descending'
      );
    } else {
      th.removeAttribute('aria-sort');
    }
  });

  var limit = DETAIL_ALL ? rows.length : DETAIL_PAGE;
  var shown = Math.min(limit, rows.length);

  id('detailCount').textContent = rows.length > shown
    ? fmtInt(shown) + ' de ' + fmtInt(rows.length) + ' filas'
    : fmtInt(rows.length) + (rows.length === 1 ? ' fila' : ' filas');

  var more = id('btnDetailAll');
  more.hidden = rows.length <= DETAIL_PAGE;
  more.textContent = DETAIL_ALL
    ? 'Ver solo las primeras ' + DETAIL_PAGE
    : 'Ver las ' + fmtInt(rows.length) + ' filas';

  if (!rows.length) {
    body.innerHTML = '<tr class="empty"><td colspan="9">' +
      'No hay filas para el filtro seleccionado. Prueba a limpiar los ' +
      'filtros o a elegir otro mes.</td></tr>';
    return;
  }

  body.innerHTML = rows.slice(0, limit).map(function(row) {
    var place = [row.predio, row.rol].filter(Boolean).join(' / ');
    var estatus = (row.estatus || '').split(' / ').filter(Boolean);

    return '<tr>' +
      '<td class="num">' + esc(row.fechaLabel) + '</td>' +
      '<td><span class="tag ' +
        (row.source === 'GMAIL' ? 'tag-gmail' : 'tag-real') + '">' +
        (row.source === 'GMAIL' ? 'Gmail' : 'Real') + '</span></td>' +
      '<td class="name"><b>' + esc(row.provider) + '</b></td>' +
      '<td class="dim">' + esc(clip(row.providerRaw, 42)) + '</td>' +
      '<td>' + esc(clip(place, 34)) + '</td>' +
      '<td>' + estatus.map(function(value) {
        return '<span class="dot dot-' +
          value.toLowerCase().replace(/[^a-z]/g, '') + '" title="' +
          esc(value) + '"></span>';
      }).join(' ') + '</td>' +
      '<td class="n num">' +
        (row.cumplimiento === null || row.cumplimiento === undefined
          ? '' : fmt(row.cumplimiento)) + '</td>' +
      '<td class="n num">' + fmt(row.cantidad) + '</td>' +
      '<td class="dim">' + esc(row.matchMethod) +
        (row.matchScore
          ? ' (' + Number(row.matchScore).toFixed(2) + ')' : '') + '</td>' +
    '</tr>';
  }).join('');
}

          '<div class="drawer-figures">' +

              return '<div class="drawer-figure">' +

/**
 * La ficha es un diálogo modal: el tabulador no debe escaparse hacia el
 * tablero de atrás, y al cerrar el foco vuelve de donde salió.
 */
function trapFocus(panel) {
  if (!panel) { return; }

  var selector = 'button, [href], input, select, textarea, ' +
    '[tabindex]:not([tabindex="-1"])';

  var first = panel.querySelector(selector);

  if (first) { first.focus(); }

  panel.addEventListener('keydown', function(event) {
    if (event.key !== 'Tab') { return; }

    var nodes = Array.prototype.filter.call(
      panel.querySelectorAll(selector),
      function(node) { return node.offsetParent !== null; }
    );

    if (!nodes.length) { return; }

    var edge = event.shiftKey ? nodes[0] : nodes[nodes.length - 1];

    if (document.activeElement === edge) {
      event.preventDefault();
      (event.shiftKey ? nodes[nodes.length - 1] : nodes[0]).focus();
    }
  });
}

function originsOf(provider) {
  var names = {};

  (DATA.rows || []).forEach(function(row) {
    if (row.provider === provider && row.providerRaw) {
      names[row.providerRaw] = row.matchMethod;
    }
  });

  var list = Object.keys(names);

  if (!list.length) {
    return 'Solo aparece en la hoja Plan; todavía no registra movimiento.';
  }

  return 'Se consolida desde ' + list.length +
    (list.length === 1 ? ' nombre' : ' nombres') + ': ' +
    list.map(function(name) {
      return name + ' (' + names[name].toLowerCase() + ')';
    }).join('; ') + '.';
}

function closeDrawer() {
  if (!PICKED) { return; }

  var provider = PICKED;

  PICKED = null;
  id('drawerHost').innerHTML = '';
  renderProviderTable();

  // La tabla se vuelve a pintar, así que el nodo de origen ya no existe:
  // se busca de nuevo el botón de ese proveedor.
  var back = (LAST_FOCUS && document.contains(LAST_FOCUS))
    ? LAST_FOCUS
    : document.querySelector(
        '#providerBody .linkish[data-provider="' + cssEscape(provider) + '"]'
      );

  if (back && back.focus) { back.focus(); }

  LAST_FOCUS = null;
}

/**
 * Resumen en texto plano, listo para pegar en un correo o en WhatsApp.
 */
function copySummary() {
  var wd = workdays();
  var plan = sum(SUMMARY, 'plan');
  var total = sum(SUMMARY, 'actual') + sum(SUMMARY, 'gmail');
  var planToDate = plan * (wd.fraction || 0);
  var pace = wd.elapsed > 0 ? total / wd.elapsed : 0;
  var projection = pace * wd.total;
  var risk = sum(SUMMARY, 'risk');

  var need = wd.remaining > 0
    ? Math.max(0, plan - total) / wd.remaining
    : 0;

  var lines = [
    'METRORUMA · ' + cap(DATA.month.label) + ' · corte ' + wd.referenceDateLabel,
    'Días hábiles: ' + wd.elapsed + ' de ' + wd.total +
      ' (quedan ' + wd.remaining + ')',
    '',
    'Recibido: ' + fmt(total) + ' MR',
    'Plan a la fecha: ' + fmt(planToDate) + ' MR (' +
      (planToDate > 0 ? pctText(total / planToDate) : 's/plan') + ')',
    'Desvío: ' + signed(total - planToDate) + ' MR',
    'Cierre proyectado: ' + fmt(projection) + ' MR de ' + fmt(plan) + ' MR',
    'MR en riesgo: ' + fmt(risk),
    'Ritmo actual: ' + fmt(pace) + ' MR/día · exigido ' + fmt(need) + ' MR/día',
    ''
  ];

  var attack = SUMMARY
    .filter(function(item) { return item.risk > 0; })
    .slice(0, 5);

  if (attack.length) {
    lines.push('Prioridades:');

    attack.forEach(function(item, index) {
      lines.push(
        (index + 1) + '. ' + item.provider + ': ' + fmt(item.risk) +
        ' MR en riesgo, proyecta ' + fmt(item.projection) + ' de ' +
        fmt(item.plan) + ' MR' +
        (item.idleDays >= 3
          ? ' (sin recibir hace ' + item.idleDays + ' días)' : '')
      );
    });
  } else {
    lines.push('Sin proveedores en riesgo de cierre bajo plan.');
  }

  copyText(lines.join('\n'), 'Resumen copiado. Pégalo donde lo necesites.');
}

function copyText(text, message) {
  var area = document.createElement('textarea');

  area.value = text;
  area.setAttribute('readonly', 'readonly');
  area.style.position = 'fixed';
  area.style.top = '-1000px';
  document.body.appendChild(area);
  area.select();

  var done = false;

  try {
    done = document.execCommand('copy');
  } catch (error) {
    done = false;
  }

  document.body.removeChild(area);
  toast(done ? message : 'El navegador bloqueó el portapapeles.');
}

function toast(message) {
  var node = id('tooltip');

  node.innerHTML = '<div class="tooltip-title">' + esc(message) + '</div>';
  node.style.left = '50%';
  node.style.top = 'auto';
  node.style.bottom = '22px';
  node.style.transform = 'translateX(-50%)';
  node.classList.add('is-on');

  clearTimeout(toast.timer);

  toast.timer = setTimeout(function() {
    node.classList.remove('is-on');
    node.style.bottom = '';
    node.style.transform = '';
  }, 2600);
}
