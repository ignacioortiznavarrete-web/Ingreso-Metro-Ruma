<script>
/* =====================================================================
 * MetroRuma · lógica del tablero
 *
 * Todo el análisis se hace en el navegador sobre las filas que entrega
 * getDashboardData(). El servidor solo lee planillas y guarda apuntes.
 * ===================================================================== */

var DATA = null;
var VIEW = 'panorama';
var ROWS = [];
var SUMMARY = [];
var WEEKS = [];
var DRAFTS = {};
var SORT = { key: 'risk', dir: 'desc' };
var CURVE_MODE = 'mr';
var GAP_MODE = 'abs';
var PICKED = null;
var BUSY = false;

var PALETTE = {
  brand: '#24395e',
  brand2: '#3a5c8c',
  brand3: '#7d9bc2',
  hiviz: '#e2600f',
  hivizInk: '#9c400a',
  crit: '#a81f14',
  ink: '#191e26',
  ink2: '#47515f',
  ink3: '#606a78',
  line: '#dbe1e9',
  line2: '#c2cbd6',
  sunk: '#e9edf2',
  wash: '#eaeff6'
};

/* Umbrales de clasificación sobre el cumplimiento a la fecha. */
var BANDS = {
  over: 1.15,
  ok: 0.95,
  warn: 0.80
};

/* =====================================================================
 * ARRANQUE
 * ===================================================================== */

document.addEventListener('DOMContentLoaded', function() {
  bindEvents();

  if (window.matchMedia('(max-width: 860px)').matches) {
    id('filterBox').open = false;
  }

  loadData();
});

function bindEvents() {
  each('.rail-tab', function(tab) {
    tab.addEventListener('click', function() {
      switchView(tab.dataset.view);
    });

    tab.addEventListener('keydown', function(event) {
      var tabs = Array.prototype.slice.call(all('.rail-tab'));
      var index = tabs.indexOf(tab);
      var next = null;

      if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
        next = tabs[(index + 1) % tabs.length];
      } else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
        next = tabs[(index - 1 + tabs.length) % tabs.length];
      }

      if (next) {
        event.preventDefault();
        next.focus();
        switchView(next.dataset.view);
      }
    });
  });

  id('btnReload').addEventListener('click', function() { loadData(); });
  id('btnSheet').addEventListener('click', openSheet);
  id('btnClear').addEventListener('click', clearFilters);
  id('btnCopy').addEventListener('click', copySummary);
  id('btnExport').addEventListener('click', copyProviderTable);

  id('fMonth').addEventListener('change', function() {
    loadData(id('fMonth').value);
  });

  ['fFrom', 'fTo', 'fProvider', 'fSource'].forEach(function(key) {
    id(key).addEventListener('change', renderAll);
  });

  id('fSearch').addEventListener('input', debounce(renderAll, 180));
  id('fWeek').addEventListener('change', renderWeekView);
  id('fNoteFilter').addEventListener('change', renderNotes);
  id('btnDraft').addEventListener('click', generateDrafts);
  id('btnSaveAll').addEventListener('click', saveWeek);

  id('btnCurveMode').addEventListener('click', function() {
    CURVE_MODE = CURVE_MODE === 'mr' ? 'pct' : 'mr';
    id('btnCurveMode').textContent =
      CURVE_MODE === 'mr' ? 'Ver en %' : 'Ver en MR';
    drawCurve();
  });

  id('btnGapMode').addEventListener('click', function() {
    GAP_MODE = GAP_MODE === 'abs' ? 'pct' : 'abs';
    id('btnGapMode').textContent =
      GAP_MODE === 'abs' ? 'Ver en %' : 'Ver en MR';
    drawGap();
  });

  each('#providerTable th.sortable', function(th) {
    th.addEventListener('click', function() {
      var key = th.dataset.sort;

      if (SORT.key === key) {
        SORT.dir = SORT.dir === 'desc' ? 'asc' : 'desc';
      } else {
        SORT.key = key;
        SORT.dir = key === 'provider' ? 'asc' : 'desc';
      }

      renderProviderTable();
    });
  });

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') { closeDrawer(); }
  });

  window.addEventListener('resize', debounce(function() {
    if (DATA) { redrawCharts(); }
  }, 200));
}

function switchView(view) {
  if (!view || view === VIEW) { return; }

  VIEW = view;

  each('.rail-tab', function(tab) {
    tab.setAttribute(
      'aria-selected', tab.dataset.view === view ? 'true' : 'false'
    );
  });

  var names = {
    panorama: 'Panorama del mes',
    proveedores: 'Cruce por proveedor',
    semana: 'Apuntes de la semana',
    detalle: 'Auditoría del dato'
  };

  id('viewName').textContent = names[view] || '';

  each('.tabpanel', function(panel) {
    var on = panel.id === 'view-' + view;
    panel.hidden = !on;

    if (on) {
      panel.classList.remove('is-entering');
      void panel.offsetWidth;
      panel.classList.add('is-entering');
    }
  });

  redrawCharts();
}

/* =====================================================================
 * CARGA
 * ===================================================================== */

function loadData(monthPrefix) {
  setBusy(true);
  hide('bannerError');
  step('leyendo la planilla…');

  var handler = {
    ok: function(result) {
      DATA = result;
      DRAFTS = {};
      step('cruzando proveedores…');
      configure();
      renderAll();
      setBusy(false);
    },
    fail: function(error) {
      setBusy(false);
      showError(
        (error && error.message) ? error.message : String(error)
      );
    }
  };

  if (typeof google === 'undefined' || !google.script) {
    handler.fail(new Error(
      'Esta página necesita ejecutarse dentro de Google Apps Script.'
    ));
    return;
  }

  google.script.run
    .withSuccessHandler(handler.ok)
    .withFailureHandler(handler.fail)
    .getDashboardData(monthPrefix || null);
}

function configure() {
  var month = DATA.month || {};
  var source = DATA.source || {};
  var wd = workdays();

  fillSelect('fMonth', (DATA.availableMonths || []).map(function(item) {
    return { value: item.prefix, label: cap(item.label) };
  }), null);

  id('fMonth').value = month.prefix || '';

  id('stampCut').textContent = wd.referenceDateLabel || '—';
  id('stampDays').textContent = wd.elapsed + '/' + wd.total;
  id('stampActual').textContent = source.lastActualDateLabel || '—';
  id('stampReport').textContent = source.latestReportDateLabel || '—';

  id('fFrom').value = month.startKey || '';
  id('fTo').value = month.endKey || '';

  fillSelect(
    'fProvider',
    (DATA.filters.providers || []).map(function(value) {
      return { value: value, label: value };
    }),
    'Todos'
  );

  renderBanners();
}

function renderBanners() {
  var source = DATA.source || {};
  var wd = workdays();
  var parts = [];

  if (source.supplementRows) {
    parts.push(
      'Datos reales hasta el ' + source.lastActualDateLabel +
      '. Del ' + source.supplementStartLabel + ' al ' +
      source.latestReportDateLabel + ' se completa con CUMPLIMIENTO × ' +
      DATA.factor + ' por proveedor.'
    );
  } else {
    parts.push(
      'No hay días posteriores al cierre de Ingresos: el tablero usa ' +
      'solo datos reales.'
    );
  }

  parts.push(
    'El plan se reparte en ' + wd.total + ' días hábiles; van ' +
    wd.elapsed + ' y quedan ' + wd.remaining + '.'
  );

  if (wd.holidays && wd.holidays.length) {
    parts.push(
      'Se descontaron ' + wd.holidays.length + ' feriado' +
      (wd.holidays.length === 1 ? '' : 's') + ': ' +
      wd.holidays.map(dmy).join(', ') + '.'
    );
  }

  id('bannerInfoText').textContent = parts.join(' ');

  var warnings = [];

  if (DATA.gmailAudit && DATA.gmailAudit.schemaOld) {
    warnings.push(
      'La hoja Informegmail todavía tiene el esquema antiguo de totales. ' +
      'Ejecuta "Reconstruir mes actual desde Gmail" para importar el ' +
      'detalle por proveedor.'
    );
  }

  var unmatched = (DATA.source.unmatchedProviders || []).length;

  if (unmatched) {
    warnings.push(
      unmatched + ' proveedor' + (unmatched === 1 ? '' : 'es') +
      ' sin fila equivalente en Plan. Revisa la pestaña Detalle.'
    );
  }

  if (warnings.length) {
    id('bannerWarnText').textContent = warnings.join(' ');
    show('bannerWarn');
  } else {
    hide('bannerWarn');
  }
}

/* =====================================================================
 * FILTRO Y ANÁLISIS
 * ===================================================================== */

function workdays() {
  return (DATA && DATA.workdays) || {
    total: 0, elapsed: 0, remaining: 0, fraction: 0,
    referenceDate: '', referenceDateLabel: '—',
    workdayKeys: [], workdaysByWeek: {}, holidays: []
  };
}

function filteredRows(ignoreSource) {
  var from = dateInput('fFrom');
  var to = dateInput('fTo');
  var provider = id('fProvider').value;
  var source = ignoreSource ? '' : id('fSource').value;
  var search = norm(id('fSearch').value);

  return (DATA.rows || []).filter(function(row) {
    if (from && row.fecha < from) { return false; }
    if (to && row.fecha > to) { return false; }
    if (provider && row.provider !== provider) { return false; }
    if (source && row.source !== source) { return false; }

    if (search) {
      var hay = norm([
        row.provider, row.providerRaw, row.predio,
        row.rol, row.material, row.descripcion
      ].join(' '));

      if (hay.indexOf(search) === -1) { return false; }
    }

    return true;
  });
}

/**
 * Métricas por proveedor. Además del cruce plan/real agrega lo que un
 * comprador necesita para decidir: metros en riesgo al cierre, ritmo
 * exigido, días hábiles sin recibir y regularidad de las entregas.
 */
function buildSummary(rows) {
  var wd = workdays();
  var fraction = wd.fraction || 0;
  var elapsed = wd.elapsed || 0;
  var totalDays = wd.total || 0;
  var remaining = wd.remaining || 0;
  var reference = wd.referenceDate || '';
  var providerFilter = id('fProvider').value;

  var planMap = {};

  (DATA.plan || []).forEach(function(item) {
    if (providerFilter && item.provider !== providerFilter) { return; }
    planMap[item.provider] =
      (planMap[item.provider] || 0) + (Number(item.plan) || 0);
  });

  var agg = {};

  rows.forEach(function(row) {
    var bucket = agg[row.provider];

    if (!bucket) {
      bucket = agg[row.provider] = {
        actual: 0, gmail: 0, lastDate: '', byDate: {}
      };
    }

    var amount = Number(row.cantidad) || 0;

    if (row.source === 'GMAIL') {
      bucket.gmail += amount;
    } else {
      bucket.actual += amount;
    }

    bucket.byDate[row.fecha] = (bucket.byDate[row.fecha] || 0) + amount;

    if (amount > 0 && row.fecha > bucket.lastDate) {
      bucket.lastDate = row.fecha;
    }
  });

  var providers = uniq(
    Object.keys(planMap).concat(Object.keys(agg))
  );

  return providers.map(function(provider) {
    var bucket = agg[provider] || { actual: 0, gmail: 0, lastDate: '', byDate: {} };
    var plan = planMap[provider] || 0;
    var actual = bucket.actual;
    var gmail = bucket.gmail;
    var total = actual + gmail;

    var planToDate = plan * fraction;
    var gapToDate = total - planToDate;
    var complianceToDate = planToDate > 0 ? total / planToDate : null;
    var compliance = plan > 0 ? total / plan : null;

    var pace = elapsed > 0 ? total / elapsed : 0;
    var projection = elapsed > 0 ? pace * totalDays : total;
    var projectedCompliance = plan > 0 ? projection / plan : null;

    var requiredPace = remaining > 0
      ? Math.max(0, plan - total) / remaining
      : null;

    // Cuánto del plan se pierde si no cambia nada.
    var risk = plan > 0 ? Math.max(0, plan - projection) : 0;

    // Días hábiles sin recepción hasta la fecha de corte.
    var idleDays = bucket.lastDate
      ? countWorkdaysBetween(bucket.lastDate, reference)
      : (plan > 0 ? elapsed : 0);

    // Regularidad: desviación relativa de las entregas diarias.
    var daily = (wd.workdayKeys || [])
      .filter(function(key) { return key <= reference; })
      .map(function(key) { return bucket.byDate[key] || 0; });

    return {
      provider: provider,
      plan: plan,
      planToDate: planToDate,
      actual: actual,
      gmail: gmail,
      total: total,
      gapToDate: gapToDate,
      gapToPlan: total - plan,
      compliance: compliance,
      complianceToDate: complianceToDate,
      pace: pace,
      projection: projection,
      projectedCompliance: projectedCompliance,
      requiredPace: requiredPace,
      effort: (requiredPace !== null && pace > 0)
        ? requiredPace / pace
        : null,
      risk: risk,
      idleDays: idleDays,
      lastDate: bucket.lastDate,
      variability: variation(daily),
      band: band(complianceToDate, plan)
    };
  })
  .filter(function(item) {
    return item.plan !== 0 || item.actual !== 0 || item.gmail !== 0;
  })
  .sort(function(a, b) { return b.risk - a.risk || b.total - a.total; });
}

function band(compliance, plan) {
  if (!plan) { return 'void'; }
  if (compliance === null) { return 'void'; }
  if (compliance >= BANDS.over) { return 'over'; }
  if (compliance >= BANDS.ok) { return 'ok'; }
  if (compliance >= BANDS.warn) { return 'warn'; }
  return 'crit';
}

var BAND_LABEL = {
  over: 'Sobre stock',
  ok: 'En línea',
  warn: 'Bajo stock',
  crit: 'Bajo stock crítico',
  void: 'Sin plan'
};

var BAND_COLOR = {
  over: PALETTE.brand,
  ok: PALETTE.brand3,
  warn: PALETTE.hiviz,
  crit: PALETTE.crit,
  void: PALETTE.line2
};

/**
 * Serie diaria: real, complemento y acumulado por día hábil.
 * Lo recibido en días no hábiles se suma al siguiente día hábil, que es
 * como lo contabiliza la operación.
 */
function buildDaily(rows) {
  var wd = workdays();
  var keys = wd.workdayKeys || [];
  var byDate = {};

  rows.forEach(function(row) {
    var slot = byDate[row.fecha];

    if (!slot) { slot = byDate[row.fecha] = { actual: 0, gmail: 0 }; }

    if (row.source === 'GMAIL') {
      slot.gmail += Number(row.cantidad) || 0;
    } else {
      slot.actual += Number(row.cantidad) || 0;
    }
  });

  var dates = Object.keys(byDate).sort();
  var cursor = 0;
  var running = 0;
  var series = [];

  keys.forEach(function(key) {
    var actual = 0;
    var gmail = 0;

    while (cursor < dates.length && dates[cursor] <= key) {
      actual += byDate[dates[cursor]].actual;
      gmail += byDate[dates[cursor]].gmail;
      cursor++;
    }

    running += actual + gmail;

    series.push({
      key: key,
      label: dmy(key),
      actual: actual,
      gmail: gmail,
      total: actual + gmail,
      cumulative: running,
      elapsed: key <= (wd.referenceDate || '')
    });
  });

  return series;
}

/**
 * Semanas ISO del mes con su plan prorrateado y lo recibido.
 */
function buildWeeks(rows, summary) {
  var wd = workdays();
  var keys = wd.workdayKeys || [];
  var reference = wd.referenceDate || '';
  var totalDays = keys.length;

  if (!totalDays) { return []; }

  var planByProvider = {};

  summary.forEach(function(item) {
    planByProvider[item.provider] = item.plan;
  });

  var order = [];
  var buckets = {};

  keys.forEach(function(key) {
    var week = isoWeek(key);
    var bucket = buckets[week];

    if (!bucket) {
      bucket = buckets[week] = {
        key: week,
        start: key,
        end: key,
        days: 0,
        daysElapsed: 0,
        providers: {}
      };
      order.push(week);
    }

    if (key < bucket.start) { bucket.start = key; }
    if (key > bucket.end) { bucket.end = key; }

    bucket.days++;
    if (key <= reference) { bucket.daysElapsed++; }
  });

  var weekOfDate = {};

  keys.forEach(function(key) { weekOfDate[key] = isoWeek(key); });

  // Un día no hábil se imputa a la semana del siguiente día hábil.
  function weekFor(date) {
    if (weekOfDate[date]) { return weekOfDate[date]; }

    for (var index = 0; index < keys.length; index++) {
      if (keys[index] >= date) { return weekOfDate[keys[index]]; }
    }

    return keys.length ? weekOfDate[keys[keys.length - 1]] : '';
  }

  rows.forEach(function(row) {
    var week = weekFor(row.fecha);
    var bucket = buckets[week];

    if (!bucket) { return; }

    var slot = bucket.providers[row.provider];

    if (!slot) {
      slot = bucket.providers[row.provider] = { actual: 0, gmail: 0 };
    }

    if (row.source === 'GMAIL') {
      slot.gmail += Number(row.cantidad) || 0;
    } else {
      slot.actual += Number(row.cantidad) || 0;
    }
  });

  return order.map(function(week) {
    var bucket = buckets[week];
    var live = bucket.daysElapsed > 0 && bucket.daysElapsed < bucket.days;

    var lines = Object.keys(planByProvider)
      .concat(Object.keys(bucket.providers))
      .filter(uniqFilter())
      .map(function(provider) {
        var slot = bucket.providers[provider] || { actual: 0, gmail: 0 };
        var monthPlan = planByProvider[provider] || 0;

        var planFull = monthPlan * bucket.days / totalDays;
        var planToDate = monthPlan * bucket.daysElapsed / totalDays;
        var received = slot.actual + slot.gmail;
        var compliance = planToDate > 0 ? received / planToDate : null;

        return {
          provider: provider,
          planFull: planFull,
          plan: planToDate,
          actual: slot.actual,
          gmail: slot.gmail,
          received: received,
          deviation: received - planToDate,
          compliance: compliance,
          band: band(compliance, monthPlan),
          monthPlan: monthPlan
        };
      })
      .filter(function(item) {
        return item.monthPlan !== 0 || item.received !== 0;
      })
      .sort(function(a, b) { return a.deviation - b.deviation; });

    var planTotal = lines.reduce(function(sum, item) {
      return sum + item.plan;
    }, 0);

    var receivedTotal = lines.reduce(function(sum, item) {
      return sum + item.received;
    }, 0);

    return {
      key: week,
      label: weekLabel(bucket.start, bucket.end),
      start: bucket.start,
      end: bucket.end,
      days: bucket.days,
      daysElapsed: bucket.daysElapsed,
      live: live,
      closed: bucket.daysElapsed >= bucket.days,
      plan: planTotal,
      received: receivedTotal,
      deviation: receivedTotal - planTotal,
      compliance: planTotal > 0 ? receivedTotal / planTotal : null,
      lines: lines
    };
  }).filter(function(item) { return item.daysElapsed > 0; });
}

function countWorkdaysBetween(fromKey, toKey) {
  var keys = workdays().workdayKeys || [];
  var count = 0;

  keys.forEach(function(key) {
    if (key > fromKey && key <= toKey) { count++; }
  });

  return count;
}

function variation(values) {
  var live = values.filter(function(value) { return value > 0; });

  if (live.length < 2) { return null; }

  var mean = live.reduce(function(a, b) { return a + b; }, 0) / live.length;

  if (!mean) { return null; }

  var spread = Math.sqrt(
    live.reduce(function(sum, value) {
      return sum + Math.pow(value - mean, 2);
    }, 0) / live.length
  );

  return spread / mean;
}
</script>

<script>
/* =====================================================================
 * MOTOR DE GRÁFICOS
 * SVG propio: control total del color, la tipografía y la entrada.
 * ===================================================================== */

function px(host) {
  return Math.max(320, host.clientWidth || 640);
}

function niceMax(value) {
  if (!value || !isFinite(value)) { return 10; }

  var exponent = Math.pow(10, Math.floor(Math.log(value) / Math.LN10));
  var scaled = value / exponent;
  var step = scaled <= 1 ? 1 : scaled <= 2 ? 2 : scaled <= 5 ? 5 : 10;

  return step * exponent;
}

function ticks(max, count) {
  var out = [];
  var step = max / count;

  for (var index = 0; index <= count; index++) {
    out.push(step * index);
  }

  return out;
}

function attr(map) {
  return Object.keys(map)
    .filter(function(key) {
      return map[key] !== null && map[key] !== undefined && map[key] !== '';
    })
    .map(function(key) {
      return key + '="' + String(map[key]).replace(/"/g, '&quot;') + '"';
    })
    .join(' ');
}

function tag(name, map, inner) {
  return '<' + name + ' ' + attr(map) + '>' +
    (inner === undefined ? '' : inner) + '</' + name + '>';
}

function hatch(idName, color) {
  return tag('pattern', {
    id: idName,
    width: 5,
    height: 5,
    patternTransform: 'rotate(-45)',
    patternUnits: 'userSpaceOnUse'
  },
    tag('rect', { width: 5, height: 5, fill: '#ffffff' }) +
    tag('rect', { width: 2.4, height: 5, fill: color })
  );
}

/* ---------------------------------------------------------------------
 * LA RUMA
 * Regla graduada del plan del mes con el avance apilado por día hábil.
 * ------------------------------------------------------------------- */

function drawRuma() {
  var host = id('rumaFigure');
  var wd = workdays();
  var daily = buildDaily(ROWS);
  var plan = sum(SUMMARY, 'plan');

  if (!wd.total || !daily.length) {
    host.innerHTML =
      '<div class="chart-empty">No hay días hábiles configurados ' +
      'para este mes.</div>';
    renderReadout(null);
    return;
  }

  var elapsed = daily.filter(function(point) { return point.elapsed; });
  var total = elapsed.length ? elapsed[elapsed.length - 1].cumulative : 0;
  var planToDate = plan * (wd.fraction || 0);
  var pace = wd.elapsed > 0 ? total / wd.elapsed : 0;
  var projection = wd.elapsed > 0 ? pace * wd.total : total;

  var width = px(host);
  var padL = 8;
  var padR = 8;
  var barTop = 58;
  var barH = 66;
  var height = 176;
  var innerW = width - padL - padR;

  // La escala se gradúa sobre el plan del mes: así la marca del plan cae
  // en una división de la regla y no sobre un número redondo cualquiera.
  var step = (plan > 0 ? plan : Math.max(total, projection, 1)) / 10;
  var scaleMax = Math.max(plan, total, projection, step) * 1.04;
  var toX = function(value) {
    return padL + Math.max(0, Math.min(1, value / scaleMax)) * innerW;
  };

  var parts = [];

  parts.push(tag('defs', {}, hatch('rumaHatch', PALETTE.brand3)));

  // Regla graduada del fondo.
  parts.push(tag('rect', {
    x: padL, y: barTop, width: innerW, height: barH,
    rx: 4, fill: PALETTE.sunk
  }));

  for (var mark = 1; mark * step <= scaleMax; mark++) {
    var markValue = mark * step;
    var major = mark % 2 === 0;
    var isPlan = plan > 0 && Math.abs(markValue - plan) < step * 0.02;

    parts.push(tag('line', {
      x1: toX(markValue), x2: toX(markValue),
      y1: barTop + barH, y2: barTop + barH + (major ? 9 : 5),
      stroke: PALETTE.line2, 'stroke-width': 1
    }));

    if (major && !isPlan) {
      // La regla se lee como porcentaje del plan; los metros ruma
      // exactos ya están en la lectura de abajo.
      parts.push(tag('text', {
        x: toX(markValue), y: barTop + barH + 22,
        'text-anchor': 'middle', class: 'chart-axis'
      }, plan > 0
        ? Math.round(markValue / plan * 100) + '%'
        : fmt(markValue)));
    }
  }

  // Estratos: un día hábil por franja, sólido si viene de Ingresos.
  var cursor = 0;
  var index = 0;

  elapsed.forEach(function(point) {
    ['actual', 'gmail'].forEach(function(kind) {
      var amount = point[kind];

      if (amount <= 0) { return; }

      var x0 = toX(cursor);
      var x1 = toX(cursor + amount);

      parts.push(tag('rect', {
        x: x0, y: barTop + 2,
        width: Math.max(0.8, x1 - x0 - 0.7), height: barH - 4,
        fill: kind === 'gmail' ? 'url(#rumaHatch)' : PALETTE.brand,
        stroke: kind === 'gmail' ? PALETTE.brand3 : 'none',
        'stroke-width': kind === 'gmail' ? 0.8 : 0,
        class: 'strata',
        style: 'animation-delay:' + (index * 26) + 'ms',
        'data-tip': tipRow(point.label, [
          ['Del día', fmt(point.total) + ' MR'],
          ['Acumulado', fmt(point.cumulative) + ' MR']
        ])
      }));

      cursor += amount;
      index++;
    });
  });

  // Silueta del pronóstico.
  if (projection > total) {
    parts.push(tag('rect', {
      x: toX(total), y: barTop + 2,
      width: Math.max(1, toX(projection) - toX(total)), height: barH - 4,
      fill: 'rgba(226,96,15,.09)',
      stroke: PALETTE.hiviz, 'stroke-width': 1.4,
      'stroke-dasharray': '5 4',
      class: 'ghost'
    }));

    parts.push(tag('text', {
      x: Math.min(width - padR, toX(projection) - 6),
      y: barTop + barH - 9,
      'text-anchor': 'end',
      class: 'chart-label',
      fill: PALETTE.hivizInk,
      style: 'font-size:10px'
    }, 'proyección'));
  }

  // Marca del plan a la fecha: la regla contra la que se mide hoy.
  parts.push(flag(
    toX(planToDate), barTop, barH,
    'Plan al ' + wd.referenceDateLabel, fmt(planToDate),
    PALETTE.ink, width - 96, 'end'
  ));

  // Tope de la regla: el plan del mes, rotulado una sola vez. En pantallas
  // angostas el rótulo se omite porque ya está en la lectura de abajo.
  if (plan > 0) {
    parts.push(tag('line', {
      x1: toX(plan), x2: toX(plan),
      y1: barTop - 8, y2: barTop + barH + 4,
      stroke: PALETTE.ink2, 'stroke-width': 1.6
    }));

    if (width >= 560) {
      parts.push(tag('text', {
        x: width - padR, y: barTop - 28,
        'text-anchor': 'end', class: 'chart-label',
        fill: PALETTE.ink3, style: 'font-size:10px'
      }, 'Plan del mes'));

      parts.push(tag('text', {
        x: width - padR, y: barTop - 14,
        'text-anchor': 'end', fill: PALETTE.ink2,
        style: 'font-size:12px;font-weight:600;font-family:var(--mono)'
      }, fmt(plan)));
    }
  }

  host.innerHTML = tag('svg', {
    viewBox: '0 0 ' + width + ' ' + height,
    width: '100%', height: height,
    role: 'img',
    'aria-label':
      'Avance de ' + fmt(total) + ' MR contra un plan a la fecha de ' +
      fmt(planToDate) + ' MR y un plan mensual de ' + fmt(plan) + ' MR.'
  }, parts.join(''));

  bindTips(host);

  renderReadout({
    total: total, plan: plan, planToDate: planToDate,
    projection: projection, pace: pace, wd: wd
  });
}

function flag(x, top, barH, title, value, color, width, side) {
  var anchor = side === 'end' ? 'end' : 'start';
  var dx = side === 'end' ? -7 : 7;
  var safeX = Math.max(70, Math.min(width - 70, x));

  return tag('g', {}, [
    tag('line', {
      x1: x, x2: x, y1: top - 26, y2: top + barH + 4,
      stroke: color, 'stroke-width': 1.6
    }),
    tag('circle', { cx: x, cy: top - 26, r: 2.6, fill: color }),
    tag('text', {
      x: safeX + dx, y: top - 28, 'text-anchor': anchor,
      class: 'chart-label', fill: color,
      style: 'font-size:10px;font-weight:600'
    }, esc(title)),
    tag('text', {
      x: safeX + dx, y: top - 14, 'text-anchor': anchor,
      fill: color,
      style: 'font-size:12px;font-weight:600;font-family:var(--mono)'
    }, esc(value))
  ].join(''));
}

/* ---------------------------------------------------------------------
 * CURVA DE AVANCE
 * ------------------------------------------------------------------- */

function drawCurve() {
  var host = id('chartCurve');
  var wd = workdays();
  var daily = buildDaily(ROWS);
  var plan = sum(SUMMARY, 'plan');

  if (!daily.length) {
    host.innerHTML = '<div class="chart-empty">Sin días hábiles que graficar.</div>';
    return;
  }

  var pct = CURVE_MODE === 'pct' && plan > 0;
  var width = px(host);
  var height = 300;
  var padL = pct ? 44 : 62;
  var padR = 16;
  var padT = 16;
  var padB = 42;
  var innerW = width - padL - padR;
  var innerH = height - padT - padB;

  var count = daily.length;
  var elapsedCount = daily.filter(function(p) { return p.elapsed; }).length;
  var total = elapsedCount ? daily[elapsedCount - 1].cumulative : 0;
  var pace = wd.elapsed > 0 ? total / wd.elapsed : 0;

  var planAt = function(index) { return plan * (index + 1) / count; };
  var conv = function(value, index) {
    if (!pct) { return value; }
    var reference = planAt(index);
    return reference > 0 ? (value / reference) * 100 : 0;
  };

  var values = [];

  daily.forEach(function(point, index) {
    values.push(conv(planAt(index), index));
    if (point.elapsed) { values.push(conv(point.cumulative, index)); }
  });

  if (elapsedCount) {
    for (var i = elapsedCount - 1; i < count; i++) {
      values.push(conv(total + pace * (i - elapsedCount + 1), i));
      values.push(conv(
        total + Math.max(0, plan - total) *
          ((i - elapsedCount + 1) / Math.max(1, count - elapsedCount)),
        i
      ));
    }
  }

  var maxValue = niceMax(Math.max.apply(null, values.concat([1])) * 1.05);
  var minValue = pct ? Math.min(70, Math.floor(Math.min.apply(null, values) / 10) * 10) : 0;

  var toX = function(index) {
    return padL + (count === 1 ? innerW / 2 : (index / (count - 1)) * innerW);
  };

  var toY = function(value) {
    var span = maxValue - minValue || 1;
    return padT + innerH - ((value - minValue) / span) * innerH;
  };

  var parts = [];

  // Rejilla y eje vertical.
  ticks(maxValue - minValue, 4).forEach(function(offset) {
    var value = minValue + offset;

    parts.push(tag('line', {
      x1: padL, x2: width - padR, y1: toY(value), y2: toY(value),
      class: 'chart-grid'
    }));

    parts.push(tag('text', {
      x: padL - 8, y: toY(value) + 3.5,
      'text-anchor': 'end', class: 'chart-axis'
    }, pct ? Math.round(value) + '%' : fmt(value)));
  });

  // Corredor aceptable de ±5% sobre el plan prorrateado.
  var bandTop = [];
  var bandBottom = [];

  daily.forEach(function(point, index) {
    bandTop.push(toX(index) + ',' + toY(conv(planAt(index) * 1.05, index)));
    bandBottom.push(toX(index) + ',' + toY(conv(planAt(index) * 0.95, index)));
  });

  parts.push(tag('polygon', {
    points: bandTop.join(' ') + ' ' + bandBottom.reverse().join(' '),
    fill: 'rgba(125,155,194,.16)'
  }));

  // Plan a la fecha.
  parts.push(line(
    daily.map(function(point, index) {
      return [toX(index), toY(conv(planAt(index), index))];
    }),
    PALETTE.ink2, 1.6, '6 4'
  ));

  // Ritmo exigido para cerrar el plan.
  if (elapsedCount && elapsedCount < count && plan > total) {
    var need = [];

    for (var j = elapsedCount - 1; j < count; j++) {
      var progress = (j - elapsedCount + 1) / Math.max(1, count - elapsedCount);
      need.push([toX(j), toY(conv(total + (plan - total) * progress, j))]);
    }

    parts.push(line(need, PALETTE.hiviz, 1.8, '3 3'));
  }

  // Proyección al ritmo actual.
  if (elapsedCount && elapsedCount < count) {
    var proj = [];

    for (var k = elapsedCount - 1; k < count; k++) {
      proj.push([toX(k), toY(conv(total + pace * (k - elapsedCount + 1), k))]);
    }

    parts.push(line(proj, PALETTE.brand3, 1.8, '2 4'));
  }

  // Avance real acumulado.
  var walk = daily
    .filter(function(point) { return point.elapsed; })
    .map(function(point, index) {
      return [toX(index), toY(conv(point.cumulative, index))];
    });

  if (walk.length) {
    parts.push(area(walk, toY(minValue), 'rgba(36,57,94,.10)'));
    parts.push(line(walk, PALETTE.brand, 2.6, null, true));

    var last = walk[walk.length - 1];
    parts.push(tag('circle', {
      cx: last[0], cy: last[1], r: 4,
      fill: PALETTE.brand, stroke: '#fff', 'stroke-width': 2
    }));
  }

  // Eje de fechas.
  var everyX = Math.max(1, Math.ceil(count / 14));

  daily.forEach(function(point, index) {
    if (index % everyX !== 0 && index !== count - 1) { return; }

    parts.push(tag('text', {
      x: toX(index), y: height - padB + 16,
      'text-anchor': 'middle', class: 'chart-axis'
    }, point.label.slice(0, 5)));
  });

  // Zona sensible por día para el tooltip.
  daily.forEach(function(point, index) {
    var slot = innerW / Math.max(1, count - 1);

    parts.push(tag('rect', {
      x: toX(index) - slot / 2, y: padT,
      width: slot, height: innerH,
      fill: 'transparent',
      'data-tip': tipRow(point.label, [
        ['Plan a la fecha', fmt(planAt(index)) + ' MR'],
        point.elapsed
          ? ['Avance real', fmt(point.cumulative) + ' MR']
          : ['Avance real', 'sin dato aún'],
        point.elapsed
          ? ['Diferencia', signed(point.cumulative - planAt(index)) + ' MR']
          : null
      ])
    }));
  });

  parts.push(legend(width, height, [
    ['Avance acumulado', PALETTE.brand, 'solid'],
    ['Plan a la fecha', PALETTE.ink2, 'dash'],
    ['Corredor ±5%', 'rgba(125,155,194,.5)', 'band'],
    ['Ritmo exigido', PALETTE.hiviz, 'dash'],
    ['Al ritmo actual', PALETTE.brand3, 'dash']
  ]));

  host.innerHTML = tag('svg', {
    viewBox: '0 0 ' + width + ' ' + (height + 26),
    width: '100%', height: height + 26, role: 'img',
    'aria-label': 'Curva de avance acumulado contra el plan prorrateado.'
  }, parts.join(''));

  bindTips(host);
}

function line(points, color, weight, dash, animate) {
  if (!points.length) { return ''; }

  var d = points.map(function(point, index) {
    return (index ? 'L' : 'M') + round(point[0]) + ' ' + round(point[1]);
  }).join(' ');

  var length = 0;

  for (var index = 1; index < points.length; index++) {
    length += Math.hypot(
      points[index][0] - points[index - 1][0],
      points[index][1] - points[index - 1][1]
    );
  }

  return tag('path', {
    d: d, fill: 'none', stroke: color,
    'stroke-width': weight,
    'stroke-linecap': 'round',
    'stroke-linejoin': 'round',
    'stroke-dasharray': animate ? round(length) : dash,
    class: animate ? 'trace' : null,
    style: animate ? '--len:' + round(length) : null
  });
}

function area(points, baseline, fill) {
  if (!points.length) { return ''; }

  var d = points.map(function(point, index) {
    return (index ? 'L' : 'M') + round(point[0]) + ' ' + round(point[1]);
  }).join(' ') +
    ' L' + round(points[points.length - 1][0]) + ' ' + round(baseline) +
    ' L' + round(points[0][0]) + ' ' + round(baseline) + ' Z';

  return tag('path', { d: d, fill: fill, class: 'ghost' });
}

function legend(width, height, items) {
  var x = 0;

  return tag('g', { transform: 'translate(0,' + (height + 14) + ')' },
    items.map(function(item) {
      var mark = item[2] === 'band'
        ? tag('rect', { x: x, y: -6, width: 14, height: 8, fill: item[1], rx: 1 })
        : tag('line', {
            x1: x, x2: x + 14, y1: -2, y2: -2,
            stroke: item[1], 'stroke-width': 2.4,
            'stroke-dasharray': item[2] === 'dash' ? '4 3' : null,
            'stroke-linecap': 'round'
          });

      var label = tag('text', {
        x: x + 19, y: 1.5, class: 'chart-label', style: 'font-size:10px'
      }, esc(item[0]));

      x += 19 + item[0].length * 5.4 + 16;
      return mark + label;
    }).join('')
  );
}
</script>

<script>
/* ---------------------------------------------------------------------
 * RECEPCIÓN DIARIA
 * ------------------------------------------------------------------- */

function drawDaily() {
  var host = id('chartDaily');
  var wd = workdays();
  var daily = buildDaily(ROWS).filter(function(point) { return point.elapsed; });
  var plan = sum(SUMMARY, 'plan');
  var dailyPlan = wd.total ? plan / wd.total : 0;

  if (!daily.length) {
    host.innerHTML = '<div class="chart-empty">Todavía no hay recepciones ' +
      'registradas en el rango seleccionado.</div>';
    return;
  }

  var width = px(host);
  var height = 300;
  var padL = 62;
  var padR = 16;
  var padT = 16;
  var padB = 42;
  var innerW = width - padL - padR;
  var innerH = height - padT - padB;
  var count = daily.length;

  var maxValue = niceMax(Math.max(
    dailyPlan * 1.25,
    Math.max.apply(null, daily.map(function(point) { return point.total; }))
  ) * 1.08) || 10;

  var slot = innerW / count;
  var barW = Math.max(3, Math.min(30, slot * 0.62));

  var toX = function(index) { return padL + slot * (index + 0.5); };
  var toY = function(value) {
    return padT + innerH - (value / maxValue) * innerH;
  };

  var parts = [tag('defs', {}, hatch('dailyHatch', PALETTE.brand3))];

  ticks(maxValue, 4).forEach(function(value) {
    parts.push(tag('line', {
      x1: padL, x2: width - padR, y1: toY(value), y2: toY(value),
      class: 'chart-grid'
    }));

    parts.push(tag('text', {
      x: padL - 8, y: toY(value) + 3.5,
      'text-anchor': 'end', class: 'chart-axis'
    }, fmt(value)));
  });

  // Barras apiladas: primero lo real, encima el complemento.
  daily.forEach(function(point, index) {
    var base = padT + innerH;
    var x = toX(index) - barW / 2;

    [['actual', PALETTE.brand], ['gmail', 'url(#dailyHatch)']].forEach(
      function(pair) {
        var amount = point[pair[0]];

        if (amount <= 0) { return; }

        var h = (amount / maxValue) * innerH;
        base -= h;

        parts.push(tag('rect', {
          x: x, y: base, width: barW, height: Math.max(1, h),
          rx: 1.5,
          fill: pair[1],
          stroke: pair[0] === 'gmail' ? PALETTE.brand3 : 'none',
          'stroke-width': pair[0] === 'gmail' ? 0.8 : 0,
          class: 'bar-grow',
          style: 'animation-delay:' + (index * 18) + 'ms'
        }));
      }
    );
  });

  // Plan diario.
  parts.push(line(
    daily.map(function(point, index) { return [toX(index), toY(dailyPlan)]; }),
    PALETTE.ink2, 1.5, '6 4'
  ));

  // Promedio móvil de 5 días hábiles: separa la tendencia del ruido.
  if (count >= 3) {
    var window = Math.min(5, count);
    var moving = daily.map(function(point, index) {
      var from = Math.max(0, index - window + 1);
      var slice = daily.slice(from, index + 1);
      var mean = slice.reduce(function(total, item) {
        return total + item.total;
      }, 0) / slice.length;

      return [toX(index), toY(mean)];
    });

    parts.push(line(moving, PALETTE.hiviz, 2.4, null, true));
  }

  var everyX = Math.max(1, Math.ceil(count / 14));

  daily.forEach(function(point, index) {
    if (index % everyX !== 0 && index !== count - 1) { return; }

    parts.push(tag('text', {
      x: toX(index), y: height - padB + 16,
      'text-anchor': 'middle', class: 'chart-axis'
    }, point.label.slice(0, 5)));
  });

  daily.forEach(function(point, index) {
    parts.push(tag('rect', {
      x: padL + slot * index, y: padT, width: slot, height: innerH,
      fill: 'transparent',
      'data-tip': tipRow(point.label, [
        ['Ingreso real', fmt(point.actual) + ' MR'],
        ['Complemento', fmt(point.gmail) + ' MR'],
        ['Total del día', fmt(point.total) + ' MR'],
        ['Plan diario', fmt(dailyPlan) + ' MR'],
        ['Diferencia', signed(point.total - dailyPlan) + ' MR']
      ])
    }));
  });

  parts.push(legend(width, height, [
    ['Ingreso real', PALETTE.brand, 'solid'],
    ['Complemento Gmail', PALETTE.brand3, 'solid'],
    ['Media 5 días', PALETTE.hiviz, 'solid'],
    ['Plan diario', PALETTE.ink2, 'dash']
  ]));

  host.innerHTML = tag('svg', {
    viewBox: '0 0 ' + width + ' ' + (height + 26),
    width: '100%', height: height + 26, role: 'img',
    'aria-label': 'Recepción diaria contra el plan por día hábil.'
  }, parts.join(''));

  bindTips(host);
}

/* ---------------------------------------------------------------------
 * DESVÍO POR PROVEEDOR
 * ------------------------------------------------------------------- */

function drawGap() {
  var host = id('chartGap');
  var rows = SUMMARY
    .filter(function(item) { return item.plan > 0; })
    .slice()
    .sort(function(a, b) { return a.gapToDate - b.gapToDate; });

  if (!rows.length) {
    host.innerHTML = '<div class="chart-empty">Ningún proveedor del ' +
      'filtro tiene plan asignado este mes.</div>';
    return;
  }

  var pct = GAP_MODE === 'pct';
  var rowH = 22;
  var padT = 10;
  var padB = 46;
  var labelW = 152;
  var padR = 58;
  var width = px(host);
  var height = padT + rows.length * rowH + padB;
  var innerW = Math.max(120, width - labelW - padR);

  var valueOf = function(item) {
    if (!pct) { return item.gapToDate; }
    return item.planToDate > 0
      ? (item.gapToDate / item.planToDate) * 100
      : 0;
  };

  var extent = Math.max.apply(null, rows.map(function(item) {
    return Math.abs(valueOf(item));
  }).concat([1]));

  var scale = niceMax(extent * 1.08);
  var zero = labelW + innerW / 2;
  var toW = function(value) {
    return Math.abs(value) / scale * (innerW / 2);
  };

  var parts = [];

  parts.push(tag('line', {
    x1: zero, x2: zero, y1: padT - 4, y2: height - padB + 4,
    stroke: PALETTE.ink2, 'stroke-width': 1.2
  }));

  [-1, -0.5, 0.5, 1].forEach(function(factor) {
    var x = zero + factor * (innerW / 2);

    parts.push(tag('line', {
      x1: x, x2: x, y1: padT - 4, y2: height - padB + 4,
      class: 'chart-grid', 'stroke-dasharray': '2 3'
    }));

    parts.push(tag('text', {
      x: x, y: height - padB + 20,
      'text-anchor': 'middle', class: 'chart-axis'
    }, pct
      ? signed(scale * factor, 0) + '%'
      : signed(scale * factor)
    ));
  });

  rows.forEach(function(item, index) {
    var y = padT + index * rowH;
    var value = valueOf(item);
    var w = Math.max(1.5, toW(value));
    var negative = value < 0;
    var color = BAND_COLOR[item.band] || PALETTE.line2;

    parts.push(tag('text', {
      x: labelW - 10, y: y + rowH / 2 + 3.5,
      'text-anchor': 'end',
      class: 'chart-label',
      style: 'font-size:10.5px;font-weight:500'
    }, esc(clip(item.provider, 24))));

    parts.push(tag('rect', {
      x: negative ? zero - w : zero,
      y: y + 3.5, width: w, height: rowH - 8,
      rx: 2, fill: color,
      class: 'bar-x',
      style: 'transform-origin:' + (negative ? 'right' : 'left') +
        ';animation-delay:' + (index * 16) + 'ms',
      'data-tip': gapTip(item)
    }));

    parts.push(tag('text', {
      x: negative ? zero - w - 6 : zero + w + 6,
      y: y + rowH / 2 + 3.5,
      'text-anchor': negative ? 'end' : 'start',
      style: 'font-size:10.5px;font-weight:600;font-family:var(--mono);fill:' +
        (negative ? PALETTE.crit : PALETTE.brand)
    }, pct ? signed(value, 0) + '%' : signed(value)));
  });

  parts.push(tag('text', {
    x: labelW, y: height - padB + 36,
    class: 'chart-label', 'text-anchor': 'start',
    style: 'font-size:10px', fill: PALETTE.crit
  }, '\u2190  hay que recuperar'));

  parts.push(tag('text', {
    x: width - padR, y: height - padB + 36,
    class: 'chart-label', 'text-anchor': 'end',
    style: 'font-size:10px', fill: PALETTE.brand
  }, 'va sobre plan \u2192'));

  host.innerHTML = tag('svg', {
    viewBox: '0 0 ' + width + ' ' + height,
    width: '100%', height: height, role: 'img',
    'aria-label': 'Desvío de cada proveedor respecto del plan a la fecha.'
  }, parts.join(''));

  bindTips(host);
}

function gapTip(item) {
  return tipRow(item.provider, [
    ['Plan a la fecha', fmt(item.planToDate) + ' MR'],
    ['Recibido', fmt(item.total) + ' MR'],
    ['Desvío', signed(item.gapToDate) + ' MR'],
    ['Cumplimiento', item.complianceToDate === null
      ? 'sin plan' : pctText(item.complianceToDate)],
    ['MR en riesgo', fmt(item.risk) + ' MR']
  ]);
}

/* ---------------------------------------------------------------------
 * CONCENTRACIÓN DE LA BRECHA (PARETO)
 * ------------------------------------------------------------------- */

function drawPareto() {
  var host = id('chartPareto');

  var rows = SUMMARY
    .filter(function(item) { return item.gapToDate < 0; })
    .slice()
    .sort(function(a, b) { return a.gapToDate - b.gapToDate; })
    .slice(0, 12);

  if (!rows.length) {
    host.innerHTML = '<div class="chart-empty">Ningún proveedor está por ' +
      'debajo de su plan a la fecha. No hay brecha que concentrar.</div>';
    return;
  }

  var totalGap = rows.reduce(function(total, item) {
    return total + Math.abs(item.gapToDate);
  }, 0);

  var width = px(host);
  var height = 250;
  var padL = 46;
  var padR = 34;
  var padT = 30;
  var padB = 78;
  var innerW = width - padL - padR;
  var innerH = height - padT - padB;
  var slot = innerW / rows.length;
  var barW = Math.max(6, Math.min(34, slot * 0.58));

  var maxGap = niceMax(Math.abs(rows[0].gapToDate) * 1.1);
  var toX = function(index) { return padL + slot * (index + 0.5); };
  var toY = function(value) { return padT + innerH - (value / maxGap) * innerH; };
  var toYp = function(value) { return padT + innerH - (value / 100) * innerH; };

  var parts = [];

  ticks(maxGap, 4).forEach(function(value) {
    parts.push(tag('line', {
      x1: padL, x2: width - padR, y1: toY(value), y2: toY(value),
      class: 'chart-grid'
    }));

    parts.push(tag('text', {
      x: padL - 8, y: toY(value) + 3.5,
      'text-anchor': 'end', class: 'chart-axis'
    }, fmt(value)));
  });

  var running = 0;
  var curve = [];
  var crossed = -1;

  rows.forEach(function(item, index) {
    var value = Math.abs(item.gapToDate);
    running += value;

    var share = totalGap > 0 ? (running / totalGap) * 100 : 0;

    if (crossed === -1 && share >= 80) { crossed = index; }

    curve.push([toX(index), toYp(share)]);

    parts.push(tag('rect', {
      x: toX(index) - barW / 2, y: toY(value),
      width: barW, height: Math.max(1, padT + innerH - toY(value)),
      rx: 2,
      fill: BAND_COLOR[item.band] || PALETTE.hiviz,
      class: 'bar-grow',
      style: 'animation-delay:' + (index * 26) + 'ms',
      'data-tip': tipRow(item.provider, [
        ['Falta', fmt(value) + ' MR'],
        ['Del total faltante', pctText(value / (totalGap || 1))],
        ['Acumulado', Math.round(share) + '%']
      ])
    }));

    parts.push(tag('text', {
      x: toX(index), y: height - padB + 12,
      'text-anchor': 'end', class: 'chart-axis',
      transform: 'rotate(-40 ' + toX(index) + ' ' + (height - padB + 12) + ')'
    }, esc(clip(item.provider, 16))));
  });

  parts.push(line(curve, PALETTE.ink, 1.8, null, true));

  curve.forEach(function(point, index) {
    parts.push(tag('circle', {
      cx: point[0], cy: point[1], r: 2.6,
      fill: '#fff', stroke: PALETTE.ink, 'stroke-width': 1.4,
      class: 'ghost'
    }));
  });

  // Umbral del 80%: dónde se corta la lista de llamados.
  parts.push(tag('line', {
    x1: padL, x2: width - padR, y1: toYp(80), y2: toYp(80),
    stroke: PALETTE.hiviz, 'stroke-width': 1.3, 'stroke-dasharray': '5 4'
  }));

  parts.push(tag('text', {
    x: width - padR, y: toYp(80) - 5,
    'text-anchor': 'end', class: 'chart-label',
    fill: PALETTE.hivizInk, style: 'font-size:10px'
  }, '80% de la brecha'));

  if (crossed >= 0) {
    parts.push(tag('text', {
      x: padL, y: 16, class: 'chart-label',
      style: 'font-size:11.5px;font-weight:700'
    }, (crossed + 1) + (crossed === 0 ? ' proveedor explica' : ' proveedores explican') +
       ' el 80% de la brecha'));
  }

  host.innerHTML = tag('svg', {
    viewBox: '0 0 ' + width + ' ' + height,
    width: '100%', height: height, role: 'img',
    'aria-label': 'Concentración de la brecha por proveedor.'
  }, parts.join(''));

  bindTips(host);
}

/* ---------------------------------------------------------------------
 * SPARKLINE
 * ------------------------------------------------------------------- */

function sparkline(values, color, fill) {
  if (!values || values.length < 2) { return ''; }

  var width = 110;
  var height = 22;
  var max = Math.max.apply(null, values.concat([1]));
  var min = Math.min.apply(null, values.concat([0]));
  var span = (max - min) || 1;

  var points = values.map(function(value, index) {
    return [
      (index / (values.length - 1)) * width,
      height - ((value - min) / span) * (height - 3) - 1.5
    ];
  });

  var parts = [];

  if (fill) {
    parts.push(area(points, height, fill));
  }

  parts.push(line(points, color, 1.6));

  return tag('svg', {
    viewBox: '0 0 ' + width + ' ' + height,
    preserveAspectRatio: 'none',
    width: '100%', height: height, 'aria-hidden': 'true'
  }, parts.join(''));
}

/* ---------------------------------------------------------------------
 * TOOLTIP
 * ------------------------------------------------------------------- */

function tipRow(title, rows) {
  var body = (rows || [])
    .filter(Boolean)
    .map(function(row) {
      return '<div class="tooltip-row"><span>' + esc(row[0]) +
        '</span><b>' + esc(row[1]) + '</b></div>';
    })
    .join('');

  return '<div class="tooltip-title">' + esc(title) + '</div>' + body;
}

function bindTips(host) {
  var tip = id('tooltip');

  host.addEventListener('mousemove', function(event) {
    var target = event.target.closest('[data-tip]');

    if (!target) {
      tip.classList.remove('is-on');
      return;
    }

    tip.innerHTML = target.getAttribute('data-tip');
    tip.classList.add('is-on');

    var box = tip.getBoundingClientRect();
    var x = event.clientX + 14;
    var y = event.clientY - box.height - 12;

    if (x + box.width > window.innerWidth - 8) {
      x = event.clientX - box.width - 14;
    }

    if (y < 8) { y = event.clientY + 18; }

    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  });

  host.addEventListener('mouseleave', function() {
    tip.classList.remove('is-on');
  });
}

function redrawCharts() {
  if (!DATA) { return; }

  if (VIEW === 'panorama') {
    drawRuma();
    drawCurve();
    drawDaily();
  } else if (VIEW === 'proveedores') {
    drawGap();
    drawPareto();
  }
}
</script>

<script>
/* =====================================================================
 * PINTADO
 * ===================================================================== */

function renderAll() {
  if (!DATA) { return; }

  ROWS = filteredRows();
  SUMMARY = buildSummary(filteredRows(true));
  WEEKS = buildWeeks(filteredRows(true), SUMMARY);

  renderGauges();
  renderAttack();
  renderProviderTable();
  renderDetail();
  renderHealth();
  renderWeekOptions();
  renderWeekView();
  redrawCharts();

  if (VIEW !== 'panorama') { drawRuma(); }
}

function renderReadout(model) {
  var host = id('rumaReadout');

  if (!model) { host.innerHTML = ''; return; }

  var gap = model.total - model.planToDate;
  var remaining = model.wd.remaining || 0;
  var need = remaining > 0
    ? Math.max(0, model.plan - model.total) / remaining
    : null;

  var effort = (need !== null && model.pace > 0) ? need / model.pace : null;

  var cells = [
    {
      key: 'Recibido a la fecha',
      value: fmt(model.total),
      unit: 'MR',
      note: model.plan > 0
        ? pctText(model.total / model.plan) + ' del plan del mes'
        : 'Sin plan cargado'
    },
    {
      key: 'Desvío a la fecha',
      value: signed(gap),
      unit: 'MR',
      tone: gap >= 0 ? 'over' : (gap > -model.planToDate * 0.1 ? 'warn' : 'crit'),
      note: gap >= 0 ? 'Por delante del plan diario' : 'Por detrás del plan diario'
    },
    {
      key: 'Cierre proyectado',
      value: fmt(model.projection),
      unit: 'MR',
      tone: model.plan > 0
        ? (model.projection >= model.plan ? 'over' : 'crit')
        : null,
      note: model.plan > 0
        ? pctText(model.projection / model.plan) + ' · ' +
          signed(model.projection - model.plan) + ' MR vs plan'
        : 'Sin plan para comparar'
    },
    {
      key: 'Ritmo exigido',
      value: need === null ? '—' : fmt(need),
      unit: 'MR/día',
      tone: effort !== null && effort > 1.15 ? 'warn' : null,
      note: need === null
        ? 'No quedan días hábiles'
        : (effort === null
            ? 'Ritmo actual sin referencia'
            : 'Ritmo actual ' + fmt(model.pace) + ' MR/día · ×' +
              effort.toFixed(2) + ' de esfuerzo')
    }
  ];

  host.innerHTML = cells.map(function(cell) {
    return '<div class="readout">' +
      '<div class="readout-key">' + esc(cell.key) + '</div>' +
      '<div class="readout-value num' +
        (cell.tone ? ' is-' + cell.tone : '') + '">' +
        esc(cell.value) +
        '<span class="readout-unit">' + esc(cell.unit) + '</span>' +
      '</div>' +
      '<div class="readout-note">' + esc(cell.note) + '</div>' +
    '</div>';
  }).join('');
}

function renderGauges() {
  var wd = workdays();
  var daily = buildDaily(ROWS).filter(function(point) { return point.elapsed; });
  var plan = sum(SUMMARY, 'plan');
  var actual = sum(SUMMARY, 'actual');
  var gmail = sum(SUMMARY, 'gmail');
  var total = actual + gmail;
  var planToDate = plan * (wd.fraction || 0);
  var pace = wd.elapsed > 0 ? total / wd.elapsed : 0;
  var projection = wd.elapsed > 0 ? pace * wd.total : total;
  var risk = sum(SUMMARY, 'risk');

  var need = wd.remaining > 0
    ? Math.max(0, plan - total) / wd.remaining
    : null;

  var ranked = SUMMARY.slice().sort(function(a, b) {
    return b.total - a.total;
  });

  var topFive = ranked.slice(0, 5).reduce(function(acc, item) {
    return acc + item.total;
  }, 0);

  var idle = SUMMARY.filter(function(item) {
    return item.plan > 0 && item.idleDays >= 3;
  }).length;

  var below = SUMMARY.filter(function(item) {
    return item.band === 'warn' || item.band === 'crit';
  }).length;

  var cells = [
    {
      key: 'Recibido',
      value: fmt(total),
      note: fmt(actual) + ' real · ' + fmt(gmail) + ' complemento',
      spark: sparkline(
        daily.map(function(point) { return point.cumulative; }),
        PALETTE.brand, 'rgba(36,57,94,.12)'
      ),
      hint: 'Ingresos reales más el complemento Gmail dentro del filtro.'
    },
    {
      key: 'Plan a la fecha',
      value: fmt(planToDate),
      note: wd.elapsed + ' de ' + wd.total + ' días hábiles al ' +
        wd.referenceDateLabel,
      hint: 'Plan del mes × días hábiles transcurridos ÷ días hábiles totales.'
    },
    {
      key: 'Desvío',
      value: signed(total - planToDate),
      tone: total >= planToDate ? 'over' : 'crit',
      note: planToDate > 0
        ? pctText(total / planToDate) + ' de cumplimiento a la fecha'
        : 'Sin plan a la fecha',
      hint: 'Recibido menos plan a la fecha.'
    },
    {
      key: 'Cierre proyectado',
      value: fmt(projection),
      tone: plan > 0 ? (projection >= plan ? 'over' : 'crit') : null,
      note: plan > 0
        ? pctText(projection / plan) + ' del plan del mes'
        : 'Sin plan del mes',
      hint: 'Ritmo diario actual × días hábiles del mes.'
    },
    {
      key: 'MR en riesgo',
      value: fmt(risk),
      tone: risk > 0 ? 'warn' : null,
      note: risk > 0
        ? 'Se pierden si nadie cambia el ritmo'
        : 'Ningún proveedor cierra bajo su plan',
      hint: 'Suma, proveedor por proveedor, de lo que falta para su plan ' +
        'si mantiene el ritmo actual.'
    },
    {
      key: 'Ritmo diario',
      value: fmt(pace),
      note: need === null
        ? 'No quedan días hábiles'
        : 'Se exigen ' + fmt(need) + ' MR/día por ' + wd.remaining + ' días',
      spark: sparkline(
        daily.map(function(point) { return point.total; }),
        PALETTE.hiviz, 'rgba(226,96,15,.12)'
      ),
      hint: 'Recibido ÷ días hábiles transcurridos.'
    },
    {
      key: 'Bajo plan',
      value: String(below),
      tone: below > 0 ? 'warn' : null,
      note: 'de ' + SUMMARY.length + ' proveedores con movimiento',
      hint: 'Proveedores bajo el 95% de su plan a la fecha.'
    },
    {
      key: 'Sin recibir',
      value: String(idle),
      tone: idle > 0 ? 'warn' : null,
      note: '3 días hábiles o más sin recepción',
      hint: 'Detecta al proveedor que se detuvo antes de que el mes lo muestre.'
    },
    {
      key: 'Concentración',
      value: total > 0 ? pctText(topFive / total) : '—',
      note: 'Top 5 proveedores del abastecimiento',
      hint: 'Cuánto del suministro depende de cinco nombres.'
    }
  ];

  id('gauges').innerHTML = cells.map(function(cell) {
    return '<div class="gauge">' +
      '<div class="gauge-key">' + esc(cell.key) +
        (cell.hint
          ? '<span class="hint" title="' + esc(cell.hint) + '">?</span>'
          : '') +
      '</div>' +
      '<div class="gauge-value num' +
        (cell.tone ? ' is-' + cell.tone : '') + '">' + esc(cell.value) + '</div>' +
      '<div class="gauge-note">' + esc(cell.note) + '</div>' +
      (cell.spark ? '<div class="gauge-spark">' + cell.spark + '</div>' : '') +
    '</div>';
  }).join('');
}

function renderAttack() {
  var host = id('attackList');
  var wd = workdays();

  var rows = SUMMARY
    .filter(function(item) {
      return item.plan > 0 && (item.risk > 0 || item.idleDays >= 3);
    })
    .slice(0, 8);

  id('badgeRisk').textContent = String(rows.length);
  id('badgeRisk').hidden = rows.length === 0;

  if (!rows.length) {
    host.innerHTML =
      '<div class="attack-empty">Ningún proveedor proyecta cerrar bajo ' +
      'su plan. Mantén el seguimiento semanal.</div>';
    return;
  }

  host.innerHTML = rows.map(function(item, index) {
    var reasons = [];

    if (item.risk > 0) {
      reasons.push(
        'proyecta ' + fmt(item.projection) + ' de ' + fmt(item.plan) + ' MR'
      );
    }

    if (item.idleDays >= 3) {
      reasons.push('sin recibir hace ' + item.idleDays + ' días hábiles');
    }

    if (item.requiredPace !== null && item.effort !== null && item.effort > 1.1) {
      reasons.push(
        'necesita ' + fmt(item.requiredPace) + ' MR/día, ×' +
        item.effort.toFixed(1) + ' su ritmo'
      );
    } else if (item.requiredPace !== null && item.requiredPace > 0) {
      reasons.push('necesita ' + fmt(item.requiredPace) + ' MR/día');
    }

    return '<button type="button" class="attack-item" data-provider="' +
      esc(item.provider) + '">' +
      '<span class="attack-rank">' + pad2(index + 1) + '</span>' +
      '<span class="attack-name">' + esc(item.provider) + '</span>' +
      '<span class="attack-loss">' + fmt(item.risk) + ' MR</span>' +
      '<span class="attack-why">' + esc(cap(reasons.join(' · '))) + '</span>' +
    '</button>';
  }).join('');

  each('#attackList .attack-item', function(node) {
    node.addEventListener('click', function() {
      openDrawer(node.dataset.provider);
    });
  });
}

function renderProviderTable() {
  var body = id('providerBody');
  var foot = id('providerFoot');

  id('providerCount').textContent =
    SUMMARY.length + (SUMMARY.length === 1 ? ' proveedor' : ' proveedores');

  each('#providerTable th.sortable', function(th) {
    if (th.dataset.sort === SORT.key) {
      th.setAttribute('aria-sort', SORT.dir === 'asc' ? 'ascending' : 'descending');
    } else {
      th.removeAttribute('aria-sort');
    }
  });

  if (!SUMMARY.length) {
    body.innerHTML = '<tr class="empty"><td colspan="11">' +
      'No hay proveedores para el filtro seleccionado.</td></tr>';
    foot.innerHTML = '';
    return;
  }

  var rows = SUMMARY.slice().sort(function(a, b) {
    var key = SORT.key;
    var dir = SORT.dir === 'asc' ? 1 : -1;

    if (key === 'provider') {
      return dir * a.provider.localeCompare(b.provider, 'es', {
        sensitivity: 'base'
      });
    }

    var av = a[key] === null ? -Infinity : a[key];
    var bv = b[key] === null ? -Infinity : b[key];

    return dir * (av - bv);
  });

  body.innerHTML = rows.map(function(item) {
    return '<tr data-provider="' + esc(item.provider) + '"' +
      (PICKED === item.provider ? ' class="is-picked"' : '') + '>' +
      '<td class="name"><b>' + esc(item.provider) + '</b> ' +
        tagFor(item.band) + '</td>' +
      cell(fmt(item.plan)) +
      cell(fmt(item.planToDate)) +
      cell(fmt(item.actual)) +
      cell(fmt(item.gmail)) +
      cell('<b>' + fmt(item.total) + '</b>') +
      cell(signed(item.gapToDate), item.gapToDate >= 0 ? 'pos' : 'neg') +
      '<td class="n"><div class="cell-stack">' +
        '<span class="' + (item.complianceToDate === null ? 'dim' : '') + '">' +
          (item.complianceToDate === null
            ? 'sin plan' : pctText(item.complianceToDate)) +
        '</span>' + meter(item.complianceToDate, item.band) +
      '</div></td>' +
      cell(fmt(item.projection),
        item.plan > 0 && item.projection < item.plan ? 'neg' : 'pos') +
      cell(item.risk > 0 ? fmt(item.risk) : '—',
        item.risk > 0 ? 'neg' : 'dim') +
      cell(item.plan > 0 ? String(item.idleDays) : '—',
        item.idleDays >= 3 ? 'neg' : 'dim') +
    '</tr>';
  }).join('');

  var totals = SUMMARY.reduce(function(acc, item) {
    ['plan', 'planToDate', 'actual', 'gmail', 'total', 'projection', 'risk']
      .forEach(function(key) { acc[key] += item[key]; });
    return acc;
  }, {
    plan: 0, planToDate: 0, actual: 0, gmail: 0,
    total: 0, projection: 0, risk: 0
  });

  var gap = totals.total - totals.planToDate;

  foot.innerHTML = '<tr>' +
    '<td>Total</td>' +
    cell(fmt(totals.plan)) +
    cell(fmt(totals.planToDate)) +
    cell(fmt(totals.actual)) +
    cell(fmt(totals.gmail)) +
    cell(fmt(totals.total)) +
    cell(signed(gap), gap >= 0 ? 'pos' : 'neg') +
    cell(totals.planToDate > 0
      ? pctText(totals.total / totals.planToDate) : '—') +
    cell(fmt(totals.projection)) +
    cell(totals.risk > 0 ? fmt(totals.risk) : '—',
      totals.risk > 0 ? 'neg' : 'dim') +
    cell('') +
  '</tr>';

  each('#providerBody tr[data-provider]', function(row) {
    row.addEventListener('click', function() {
      openDrawer(row.dataset.provider);
    });
  });
}

function cell(html, className) {
  return '<td class="n' + (className ? ' ' + className : '') + '">' +
    html + '</td>';
}

function meter(compliance, bandKey) {
  if (compliance === null) { return ''; }

  var width = Math.max(2, Math.min(100, compliance * 100 * 0.66));

  return '<span class="meter">' +
    '<span class="meter-fill" style="width:' + width + '%;background:' +
      (BAND_COLOR[bandKey] || PALETTE.line2) + '"></span>' +
    '<span class="meter-mark" style="left:66%"></span>' +
  '</span>';
}

function tagFor(bandKey) {
  var cls = {
    over: 'tag-over', ok: 'tag-ok',
    warn: 'tag-warn', crit: 'tag-crit', void: 'tag-ok'
  };

  return '<span class="tag ' + (cls[bandKey] || 'tag-ok') + '">' +
    esc(BAND_LABEL[bandKey] || '') + '</span>';
}

function renderDetail() {
  var body = id('detailBody');

  var rows = ROWS.slice().sort(function(a, b) {
    if (a.fecha !== b.fecha) { return a.fecha < b.fecha ? 1 : -1; }
    return a.provider.localeCompare(b.provider, 'es', { sensitivity: 'base' });
  });

  id('detailCount').textContent = fmtInt(rows.length) + ' filas' +
    (rows.length > 600 ? ' · se muestran 600' : '');

  if (!rows.length) {
    body.innerHTML = '<tr class="empty"><td colspan="9">' +
      'No hay filas para el filtro seleccionado.</td></tr>';
    return;
  }

  body.innerHTML = rows.slice(0, 600).map(function(row) {
    var place = [row.predio, row.rol].filter(Boolean).join(' / ');
    var estatus = (row.estatus || '').split(' / ').filter(Boolean);

    return '<tr>' +
      '<td class="num">' + esc(row.fechaLabel) + '</td>' +
      '<td><span class="tag ' +
        (row.source === 'GMAIL' ? 'tag-gmail' : 'tag-real') + '">' +
        (row.source === 'GMAIL' ? 'Gmail' : 'Real') + '</span></td>' +
      '<td class="name"><b>' + esc(row.provider) + '</b></td>' +
      '<td class="dim">' + esc(clip(row.providerRaw, 42)) + '</td>' +
      '<td>' + esc(clip(place, 34)) + '</td>' +
      '<td>' + estatus.map(function(value) {
        return '<span class="dot dot-' +
          value.toLowerCase().replace(/[^a-z]/g, '') + '" title="' +
          esc(value) + '"></span>';
      }).join(' ') + '</td>' +
      '<td class="n num">' +
        (row.cumplimiento === null || row.cumplimiento === undefined
          ? '' : fmt(row.cumplimiento)) + '</td>' +
      '<td class="n num">' + fmt(row.cantidad) + '</td>' +
      '<td class="dim">' + esc(row.matchMethod) +
        (row.matchScore
          ? ' (' + Number(row.matchScore).toFixed(2) + ')' : '') + '</td>' +
    '</tr>';
  }).join('');
}

function renderHealth() {
  var source = DATA.source || {};
  var audit = DATA.gmailAudit || {};

  var figures = [
    ['Filas de Ingresos', fmtInt(source.actualRows)],
    ['Filas de complemento', fmtInt(source.supplementRows)],
    ['Informes Gmail leídos', fmtInt(audit.reports || 0)],
    ['Proveedores en Plan', fmtInt(source.planProviders)],
    ['Último dato real', source.lastActualDateLabel],
    ['Último informe', source.latestReportDateLabel]
  ];

  id('healthFigures').innerHTML = figures.map(function(pair) {
    return '<div class="drawer-figure">' +
      '<div class="readout-key">' + esc(pair[0]) + '</div>' +
      '<div class="readout-value num" style="font-size:16px">' +
        esc(String(pair[1])) + '</div>' +
    '</div>';
  }).join('');

  var unmatched = source.unmatchedProviders || [];

  id('unmatchedList').innerHTML = unmatched.length
    ? unmatched.map(function(name) {
        return '<span class="tag tag-warn" style="margin:0 4px 4px 0">' +
          esc(name) + '</span>';
      }).join('')
    : '<p class="panel-note">Todos los proveedores con movimiento tienen ' +
      'su fila en Plan.</p>';
}
</script>

<script>
/* =====================================================================
 * SEMANA · MAPA Y APUNTES
 * ===================================================================== */

function renderWeekOptions() {
  var select = id('fWeek');
  var previous = select.value;

  fillSelect('fWeek', WEEKS.map(function(week) {
    return {
      value: week.key,
      label: week.label + (week.live ? ' · en curso' : '')
    };
  }), null);

  var live = WEEKS.filter(function(week) { return week.live; })[0];
  var last = WEEKS[WEEKS.length - 1];

  select.value = (previous && WEEKS.some(function(week) {
    return week.key === previous;
  })) ? previous : ((live || last || {}).key || '');
}

function currentWeek() {
  var key = id('fWeek').value;

  return WEEKS.filter(function(week) {
    return week.key === key;
  })[0] || WEEKS[WEEKS.length - 1] || null;
}

function renderWeekView() {
  renderHeatmap();
  ensureDrafts();
  renderNotes();
}

/**
 * La semana llega con los borradores ya redactados. Solo se recalculan
 * si nunca se han visto y todavía no hay apuntes guardados.
 */
function ensureDrafts() {
  var week = currentWeek();

  if (!week || DRAFTS[week.key]) { return; }

  DRAFTS[week.key] = savedNotes(week.key).length ? [] : buildDrafts(week);
}

function heatColor(compliance) {
  if (compliance === null || compliance === undefined) {
    return null;
  }

  if (compliance >= 1.30) { return ['#1b2c4a', '#ffffff']; }
  if (compliance >= 1.15) { return ['#24395e', '#ffffff']; }
  if (compliance >= 1.05) { return ['#4d719f', '#ffffff']; }
  if (compliance >= 0.95) { return ['#bcd0e6', '#1c3358']; }
  if (compliance >= 0.85) { return ['#f7c9a4', '#7a3208']; }
  if (compliance >= 0.70) { return ['#ec8f4a', '#3d1802']; }
  return ['#b0301f', '#ffffff'];
}

function renderHeatmap() {
  var host = id('heatmap');

  if (!WEEKS.length) {
    host.innerHTML = '';
    id('heatScale').innerHTML = '';
    return;
  }

  var names = [];
  var seen = {};

  WEEKS.forEach(function(week) {
    week.lines.forEach(function(line) {
      if (line.monthPlan > 0 && !seen[line.provider]) {
        seen[line.provider] = true;
        names.push(line.provider);
      }
    });
  });

  names.sort(function(a, b) {
    var pa = SUMMARY.filter(function(item) { return item.provider === a; })[0];
    var pb = SUMMARY.filter(function(item) { return item.provider === b; })[0];
    return (pb ? pb.plan : 0) - (pa ? pa.plan : 0);
  });

  if (!names.length) {
    host.innerHTML = '<p class="panel-note" style="padding:14px 0">' +
      'No hay proveedores con plan para cruzar por semana.</p>';
    id('heatScale').innerHTML = '';
    return;
  }

  host.style.gridTemplateColumns =
    'minmax(130px, auto) repeat(' + WEEKS.length + ', minmax(66px, 1fr))';

  var cells = ['<div class="heat-head" style="text-align:left"></div>'];

  WEEKS.forEach(function(week) {
    cells.push('<div class="heat-head">' + esc(week.label) +
      (week.live ? ' ·' : '') + '</div>');
  });

  names.forEach(function(name) {
    cells.push('<div class="heat-name">' + esc(clip(name, 24)) + '</div>');

    WEEKS.forEach(function(week) {
      var line = week.lines.filter(function(item) {
        return item.provider === name;
      })[0];

      if (!line || line.plan <= 0) {
        cells.push('<div class="heat-cell is-void" title="Sin plan esa semana">—</div>');
        return;
      }

      var colors = heatColor(line.compliance);

      cells.push('<div class="heat-cell" style="background:' + colors[0] +
        ';color:' + colors[1] + '" data-tip="' +
        esc(tipRow(name + ' · ' + week.label, [
          ['Plan de la semana', fmt(line.plan) + ' MR'],
          ['Recibido', fmt(line.received) + ' MR'],
          ['Desvío', signed(line.deviation) + ' MR'],
          ['Cumplimiento', pctText(line.compliance)]
        ])) + '">' +
        Math.round((line.compliance || 0) * 100) + '%</div>');
    });
  });

  host.innerHTML = cells.join('');
  bindTips(host);

  id('heatScale').innerHTML = [
    ['#b0301f', 'menos de 70%'],
    ['#ec8f4a', '70 a 85%'],
    ['#f7c9a4', '85 a 95%'],
    ['#bcd0e6', 'en línea'],
    ['#4d719f', '105 a 115%'],
    ['#24395e', 'sobre 115%']
  ].map(function(pair) {
    return '<span class="heat-scale-chip">' +
      '<span class="heat-scale-swatch" style="background:' + pair[0] +
      '"></span>' + esc(pair[1]) + '</span>';
  }).join('');
}

/**
 * Redacta el diagnóstico y el plan de acción con los números de la
 * semana y del mes, como los escribiría el comprador antes de llamar.
 */
function draftFor(week, line) {
  var provider = SUMMARY.filter(function(item) {
    return item.provider === line.provider;
  })[0];

  var wd = workdays();
  var days = week.daysElapsed;
  var dayWord = days === 1 ? 'día hábil' : 'días hábiles';
  var diagnosis = [];
  var action = [];

  var slack = SUMMARY
    .filter(function(item) {
      return item.provider !== line.provider && item.gapToDate > 0;
    })
    .sort(function(a, b) { return b.gapToDate - a.gapToDate; })[0];

  if (line.received <= 0 && line.plan > 0) {
    diagnosis.push(
      'Sin recepciones en la semana con un plan de ' + fmt(line.plan) +
      ' MR para los ' + days + ' ' + dayWord + ' corridos.'
    );

    action.push(
      'Confirmar hoy estado de faena, disponibilidad de camiones y fecha ' +
      'de reposición.'
    );
  } else if (line.band === 'crit') {
    diagnosis.push(
      'Recibió ' + fmt(line.received) + ' MR contra ' + fmt(line.plan) +
      ' MR de plan para los ' + days + ' ' + dayWord + ' corridos: faltan ' +
      fmt(Math.abs(line.deviation)) + ' MR (' + pctText(line.compliance) +
      ' de cumplimiento).'
    );

    action.push(
      'Llamar hoy: pedir causa raíz (faena, camiones, cancha o clima) y ' +
      'comprometer por escrito fecha y volumen de recuperación.'
    );
  } else if (line.band === 'warn') {
    diagnosis.push(
      'Recibió ' + fmt(line.received) + ' MR contra ' + fmt(line.plan) +
      ' MR de plan para los ' + days + ' ' + dayWord + ' corridos: faltan ' +
      fmt(Math.abs(line.deviation)) + ' MR (' + pctText(line.compliance) +
      ' de cumplimiento).'
    );

    action.push(
      'Avisar la brecha y acordar el volumen de recuperación de la ' +
      'próxima semana.'
    );
  } else if (line.band === 'over') {
    diagnosis.push(
      'Recibió ' + fmt(line.received) + ' MR contra ' + fmt(line.plan) +
      ' MR de plan: ' + fmt(line.deviation) + ' MR por sobre lo programado (' +
      pctText(line.compliance) + ').'
    );

    action.push(
      'Revisar capacidad de cancha y antigüedad de la ruma antes de ' +
      'seguir recibiendo.'
    );
  } else {
    diagnosis.push(
      'Recibió ' + fmt(line.received) + ' MR contra ' + fmt(line.plan) +
      ' MR de plan (' + pctText(line.compliance) + '): dentro del corredor.'
    );

    action.push('Sin acción. Mantener seguimiento semanal.');
  }

  if (provider) {
    if (provider.risk > 0) {
      diagnosis.push(
        'En el mes proyecta cerrar en ' + fmt(provider.projection) +
        ' MR sobre un plan de ' + fmt(provider.plan) + ' MR: ' +
        fmt(provider.risk) + ' MR en riesgo.'
      );
    } else if (provider.plan > 0 && provider.projection > provider.plan) {
      diagnosis.push(
        'En el mes proyecta ' + fmt(provider.projection) + ' MR, ' +
        fmt(provider.projection - provider.plan) + ' MR sobre el plan de ' +
        fmt(provider.plan) + ' MR.'
      );
    }

    if (provider.idleDays >= 3) {
      diagnosis.push(
        'Lleva ' + provider.idleDays + ' días hábiles sin registrar recepción.'
      );
    }

    if (provider.variability !== null && provider.variability > 0.7) {
      diagnosis.push(
        'Entrega de forma irregular: sus despachos diarios varían ' +
        Math.round(provider.variability * 100) + '% respecto de su promedio.'
      );
    }

    if (
      provider.requiredPace !== null &&
      provider.requiredPace > 0 &&
      wd.remaining > 0
    ) {
      action.push(
        'Para cerrar el plan necesita ' + fmt(provider.requiredPace) +
        ' MR/día hábil en los ' + wd.remaining + ' días que quedan' +
        (provider.effort !== null && provider.effort > 1.05
          ? ', ' + provider.effort.toFixed(1) + ' veces su ritmo actual de ' +
            fmt(provider.pace) + ' MR/día.'
          : ', en línea con su ritmo actual.')
      );
    }

    if (
      (provider.band === 'crit' ||
        (provider.effort !== null && provider.effort > 1.4)) &&
      slack && provider.risk > 0
    ) {
      action.push(
        'Si no hay capacidad, reasignar hasta ' + fmt(provider.risk) +
        ' MR a ' + slack.provider + ', que va ' + fmt(slack.gapToDate) +
        ' MR sobre su plan a la fecha.'
      );
    }

    if (provider.band === 'over' && provider.projection > provider.plan) {
      action.push(
        'Frenar programación por ' +
        fmt(provider.projection - provider.plan) +
        ' MR para no inmovilizar stock en cancha.'
      );
    }
  }

  return {
    diagnosis: diagnosis.join(' '),
    action: action.join(' ')
  };
}

function generateDrafts() {
  var week = currentWeek();

  if (!week) { return; }

  DRAFTS[week.key] = buildDrafts(week);
  renderNotes();
  toast(
    DRAFTS[week.key].length +
    ' borradores recalculados con los números de hoy.'
  );
}

function buildDrafts(week) {
  var saved = savedNotes(week.key);
  var taken = {};

  saved.forEach(function(note) { taken[note.provider] = true; });

  var drafts = week.lines
    .filter(function(line) {
      if (taken[line.provider]) { return false; }
      if (line.monthPlan <= 0 && line.received <= 0) { return false; }

      return line.band === 'crit' || line.band === 'warn' ||
        line.band === 'over' || (line.received <= 0 && line.plan > 0);
    })
    .map(function(line) {
      var text = draftFor(week, line);

      return {
        id: '',
        week: week.key,
        start: week.start,
        end: week.end,
        scope: 'PROVEEDOR',
        provider: line.provider,
        classification: BAND_LABEL[line.band] || '',
        plan: round(line.plan, 1),
        received: round(line.received, 1),
        deviation: round(line.deviation, 1),
        compliance: line.compliance === null ? 0 : round(line.compliance, 4),
        diagnosis: text.diagnosis,
        action: text.action,
        owner: '',
        status: 'Abierto',
        priority: line.band === 'crit'
          ? 'Alta' : (line.band === 'over' ? 'Baja' : 'Media'),
        draft: true
      };
    });

  // Un apunte general del mes encabeza la semana.
  if (!taken['__GENERAL__']) {
    drafts.unshift(generalDraft(week));
  }

  return drafts;
}

function generalDraft(week) {
  var wd = workdays();
  var plan = sum(SUMMARY, 'plan');
  var total = sum(SUMMARY, 'actual') + sum(SUMMARY, 'gmail');
  var planToDate = plan * (wd.fraction || 0);
  var risk = sum(SUMMARY, 'risk');
  var pace = wd.elapsed > 0 ? total / wd.elapsed : 0;
  var projection = pace * wd.total;

  var need = wd.remaining > 0
    ? Math.max(0, plan - total) / wd.remaining
    : 0;

  var behind = SUMMARY.filter(function(item) {
    return item.band === 'warn' || item.band === 'crit';
  });

  var gap = SUMMARY
    .filter(function(item) { return item.gapToDate < 0; })
    .sort(function(a, b) { return a.gapToDate - b.gapToDate; });

  var totalGap = gap.reduce(function(acc, item) {
    return acc + Math.abs(item.gapToDate);
  }, 0);

  var head = [];
  var running = 0;

  for (var index = 0; index < gap.length; index++) {
    running += Math.abs(gap[index].gapToDate);
    head.push(gap[index].provider);
    if (totalGap > 0 && running / totalGap >= 0.8) { break; }
  }

  var diagnosis =
    'Al ' + wd.referenceDateLabel + ' se llevan ' + fmt(total) + ' MR contra ' +
    fmt(planToDate) + ' MR de plan a la fecha (' +
    (planToDate > 0 ? pctText(total / planToDate) : 'sin plan') + '). ' +
    'Al ritmo de ' + fmt(pace) + ' MR por día hábil el mes cierra en ' +
    fmt(projection) + ' MR sobre un plan de ' + fmt(plan) + ' MR' +
    (risk > 0 ? ', con ' + fmt(risk) + ' MR en riesgo' : '') + '. ' +
    behind.length + ' de ' + SUMMARY.length +
    ' proveedores están bajo su plan a la fecha' +
    (head.length
      ? ' y ' + head.length + ' explican el 80% de la brecha: ' +
        head.join(', ') + '.'
      : '.');

  var action = wd.remaining > 0
    ? 'Sostener ' + fmt(need) + ' MR por día hábil en los ' + wd.remaining +
      ' días que quedan. Priorizar los llamados en el orden de la lista ' +
      'de ataque y confirmar compromisos antes del viernes.'
    : 'Mes cerrado: consolidar el resultado y ajustar el plan del mes ' +
      'siguiente con los proveedores que quedaron bajo programa.';

  return {
    id: '',
    week: week.key,
    start: week.start,
    end: week.end,
    scope: 'GENERAL',
    provider: '__GENERAL__',
    classification: 'Resumen del mes · ' +
      (BAND_LABEL[band(planToDate > 0 ? total / planToDate : null, plan)] || ''),
    plan: round(planToDate, 1),
    received: round(total, 1),
    deviation: round(total - planToDate, 1),
    compliance: planToDate > 0 ? round(total / planToDate, 4) : 0,
    diagnosis: diagnosis,
    action: action,
    owner: '',
    status: 'Abierto',
    priority: 'Alta',
    draft: true
  };
}

function savedNotes(weekKey) {
  return (DATA.apuntes || []).filter(function(note) {
    return note.week === weekKey;
  });
}

function notesForWeek(weekKey) {
  return savedNotes(weekKey).concat(DRAFTS[weekKey] || []);
}

function renderNotes() {
  var host = id('notesList');
  var week = currentWeek();

  if (!week) {
    host.innerHTML = blankState(
      'Todavía no hay semanas con días hábiles corridos en este mes.'
    );
    return;
  }

  var mode = id('fNoteFilter').value;
  var notes = notesForWeek(week.key);

  id('badgeNotes').textContent = String(
    (DATA.apuntes || []).filter(function(note) {
      return note.status !== 'Cerrado';
    }).length
  );

  id('badgeNotes').hidden = id('badgeNotes').textContent === '0';

  if (mode === 'todos') {
    var covered = {};

    notes.forEach(function(note) { covered[note.provider] = true; });

    week.lines.forEach(function(line) {
      if (covered[line.provider]) { return; }
      if (line.monthPlan <= 0 && line.received <= 0) { return; }

      var text = draftFor(week, line);

      notes.push({
        id: '', week: week.key, start: week.start, end: week.end,
        scope: 'PROVEEDOR', provider: line.provider,
        classification: BAND_LABEL[line.band] || '',
        plan: round(line.plan, 1), received: round(line.received, 1),
        deviation: round(line.deviation, 1),
        compliance: line.compliance === null ? 0 : round(line.compliance, 4),
        diagnosis: text.diagnosis, action: text.action,
        owner: '', status: 'Abierto', priority: 'Media', draft: true
      });
    });
  } else if (mode === 'guardados') {
    notes = savedNotes(week.key);
  }

  if (!notes.length) {
    host.innerHTML = blankState(
      mode === 'guardados'
        ? 'Aún no guardas apuntes de esta semana. Genera los borradores, ' +
          'corrígelos y guárdalos: quedan en la hoja Apuntes de la planilla.'
        : 'Ningún proveedor exige acción en esta semana: todos están dentro ' +
          'del corredor. Cambia el filtro a “Todos los proveedores” si ' +
          'quieres dejar constancia igualmente.'
    );
    return;
  }

  notes.sort(function(a, b) {
