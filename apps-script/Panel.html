    if (a.scope !== b.scope) { return a.scope === 'GENERAL' ? -1 : 1; }
    var rank = { Alta: 0, Media: 1, Baja: 2 };
    return (rank[a.priority] || 1) - (rank[b.priority] || 1);
  });

  host.innerHTML = notes.map(function(note, index) {
    return noteCard(note, index);
  }).join('');

  each('#notesList .note', function(card) {
    card.querySelector('[data-act="save"]').addEventListener('click', function() {
      saveNote(card);
    });

    var remove = card.querySelector('[data-act="delete"]');

    if (remove) {
      remove.addEventListener('click', function() {
        deleteNote(card.dataset.noteId, card);
      });
    }
  });
}

function noteCard(note, index) {
  var general = note.scope === 'GENERAL';
  var name = general ? 'Resumen del mes' : note.provider;

  var bandKey = general
    ? band(note.compliance, note.plan || 1)
    : bandFromLabel(note.classification);

  return '<article class="note' + (note.draft ? ' is-draft' : '') +
    '" data-note-id="' + esc(note.id) + '" data-provider="' +
    esc(note.provider) + '" data-scope="' + esc(note.scope) +
    '" data-classification="' + esc(note.classification) +
    '" data-plan="' + note.plan + '" data-received="' + note.received +
    '" data-deviation="' + note.deviation +
    '" data-compliance="' + note.compliance +
    '" style="--i:' + index + '">' +

    '<div class="note-head">' +
      '<span class="note-name">' + esc(name) + '</span>' +
      tagFor(bandKey) +
      (note.draft
        ? '<span class="tag tag-warn">Borrador sin guardar</span>'
        : '<span class="tag tag-ok">Guardado</span>') +
      '<div class="note-figures">' +
        '<span class="note-figure">Plan <b>' + fmt(note.plan) + '</b></span>' +
        '<span class="note-figure">Recibido <b>' + fmt(note.received) +
          '</b></span>' +
        '<span class="note-figure">Desvío <b>' + signed(note.deviation) +
          '</b></span>' +
        '<span class="note-figure">Cumpl. <b>' +
          (note.compliance ? pctText(note.compliance) : '—') + '</b></span>' +
      '</div>' +
    '</div>' +

    '<div class="note-grid">' +
      '<label class="field">' +
        '<span class="field-label">Diagnóstico</span>' +
        '<textarea class="textarea" data-key="diagnosis" rows="4">' +
          esc(note.diagnosis) + '</textarea>' +
      '</label>' +
      '<label class="field">' +
        '<span class="field-label">Plan de acción</span>' +
        '<textarea class="textarea" data-key="action" rows="4">' +
          esc(note.action) + '</textarea>' +
      '</label>' +
    '</div>' +

    '<div class="note-foot">' +
      '<label class="field">' +
        '<span class="field-label">Responsable</span>' +
        '<input class="input" data-key="owner" value="' +
          esc(note.owner) + '" placeholder="Quién lo toma">' +
      '</label>' +
      '<label class="field">' +
        '<span class="field-label">Estado</span>' +
        select_(['Abierto', 'En curso', 'Cerrado'], note.status, 'status') +
      '</label>' +
      '<label class="field">' +
        '<span class="field-label">Prioridad</span>' +
        select_(['Alta', 'Media', 'Baja'], note.priority, 'priority') +
      '</label>' +
      (note.updatedAt
        ? '<span class="note-saved">Actualizado ' + esc(note.updatedAt) +
          (note.author ? ' · ' + esc(note.author) : '') + '</span>'
        : '') +
      '<div class="note-foot-actions">' +
        (note.id
          ? '<button type="button" class="btn btn-sm" data-act="delete">' +
            'Eliminar</button>'
          : '') +
        '<button type="button" class="btn btn-sm btn-solid" data-act="save">' +
          'Guardar</button>' +
      '</div>' +
    '</div>' +
  '</article>';
}

function select_(options, value, key) {
  return '<select class="select" data-key="' + key + '">' +
    options.map(function(option) {
      return '<option value="' + esc(option) + '"' +
        (option === value ? ' selected' : '') + '>' + esc(option) +
        '</option>';
    }).join('') + '</select>';
}

function bandFromLabel(label) {
  var map = {
    'Sobre stock': 'over',
    'En línea': 'ok',
    'Bajo stock': 'warn',
    'Bajo stock crítico': 'crit',
    'Sin plan': 'void'
  };

  return map[label] || 'ok';
}

function readCard(card) {
  var week = currentWeek();

  var note = {
    id: card.dataset.noteId || '',
    week: week.key,
    start: week.start,
    end: week.end,
    scope: card.dataset.scope,
    provider: card.dataset.provider,
    classification: card.dataset.classification || '',
    plan: Number(card.dataset.plan) || 0,
    received: Number(card.dataset.received) || 0,
    deviation: Number(card.dataset.deviation) || 0,
    compliance: Number(card.dataset.compliance) || 0
  };

  each('[data-key]', function(field) {
    note[field.dataset.key] = field.value;
  }, card);

  return note;
}

function saveNote(card) {
  pushNotes([readCard(card)], card);
}

function saveWeek() {
  var cards = Array.prototype.slice.call(all('#notesList .note'));

  if (!cards.length) {
    toast('No hay apuntes que guardar en esta semana.');
    return;
  }

  pushNotes(cards.map(readCard), null);
}

function pushNotes(notes, card) {
  if (BUSY) { return; }

  setBusy(true, true);

  google.script.run
    .withSuccessHandler(function(list) {
      DATA.apuntes = list || [];

      var week = currentWeek();

      if (week && DRAFTS[week.key]) {
        var stored = {};

        DATA.apuntes.forEach(function(note) {
          if (note.week === week.key) { stored[note.provider] = true; }
        });

        DRAFTS[week.key] = DRAFTS[week.key].filter(function(draft) {
          return !stored[draft.provider];
        });
      }

      setBusy(false, true);
      renderNotes();
      toast(
        notes.length === 1
          ? 'Apunte guardado en la hoja Apuntes.'
          : notes.length + ' apuntes guardados en la hoja Apuntes.'
      );

      if (card) { card.classList.add('note-flash'); }
    })
    .withFailureHandler(function(error) {
      setBusy(false, true);
      showError(
        'No se pudo guardar: ' +
        ((error && error.message) ? error.message : String(error))
      );
    })
    .guardarApuntes(notes);
}

function deleteNote(noteId, card) {
  if (!noteId || BUSY) { return; }

  setBusy(true, true);

  google.script.run
    .withSuccessHandler(function(list) {
      DATA.apuntes = list || [];
      setBusy(false, true);
      renderNotes();
      toast('Apunte eliminado.');
    })
    .withFailureHandler(function(error) {
      setBusy(false, true);
      showError(
        'No se pudo eliminar: ' +
        ((error && error.message) ? error.message : String(error))
      );
    })
    .eliminarApunte(noteId);
}

function blankState(text) {
  return '<div class="blank">' +
    '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" ' +
        'stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>' +
      '<path d="M14 4v5h5M8 13h8M8 17h5" stroke="currentColor" ' +
        'stroke-width="1.5" stroke-linecap="round"/>' +
    '</svg>' +
    '<div class="blank-title">Sin apuntes en esta semana</div>' +
    '<p class="blank-text">' + esc(text) + '</p>' +
  '</div>';
}
</script>

<script>
/* =====================================================================
 * FICHA DE PROVEEDOR
 * ===================================================================== */

function openDrawer(provider) {
  var item = SUMMARY.filter(function(row) {
    return row.provider === provider;
  })[0];

  if (!item) { return; }

  PICKED = provider;

  var wd = workdays();

  var daily = buildDaily(
    ROWS.filter(function(row) { return row.provider === provider; })
  ).filter(function(point) { return point.elapsed; });

  var weekly = WEEKS.map(function(week) {
    var line = week.lines.filter(function(row) {
      return row.provider === provider;
    })[0];

    return { week: week, line: line };
  }).filter(function(entry) { return entry.line; });

  var figures = [
    ['Plan del mes', fmt(item.plan) + ' MR'],
    ['Plan a la fecha', fmt(item.planToDate) + ' MR'],
    ['Recibido', fmt(item.total) + ' MR'],
    ['Desvío', signed(item.gapToDate) + ' MR'],
    ['Cierre proyectado', fmt(item.projection) + ' MR'],
    ['MR en riesgo', item.risk > 0 ? fmt(item.risk) + ' MR' : '—'],
    ['Ritmo actual', fmt(item.pace) + ' MR/día'],
    ['Ritmo exigido', item.requiredPace === null
      ? '—' : fmt(item.requiredPace) + ' MR/día']
  ];

  var notes = (DATA.apuntes || []).filter(function(note) {
    return note.provider === provider;
  }).slice(-4).reverse();

  id('drawerHost').innerHTML =
    '<div class="scrim" data-close="1"></div>' +
    '<aside class="drawer" role="dialog" aria-modal="true" ' +
      'aria-label="Ficha de ' + esc(provider) + '">' +

      '<div class="drawer-head">' +
        '<div>' +
          '<div class="drawer-name">' + esc(provider) + '</div>' +
          '<div class="drawer-sub">' + esc(BAND_LABEL[item.band]) +
            ' · ' + (item.complianceToDate === null
              ? 'sin plan'
              : pctText(item.complianceToDate) + ' del plan a la fecha') +
            (item.lastDate
              ? ' · última recepción ' + dmy(item.lastDate)
              : ' · sin recepciones') +
          '</div>' +
        '</div>' +
        '<button type="button" class="btn btn-sm btn-quiet" data-close="1" ' +
          'style="margin-left:auto" aria-label="Cerrar">Cerrar</button>' +
      '</div>' +

      '<div class="drawer-body">' +
        '<div class="drawer-section">' +
          '<div class="drawer-figures">' +
            figures.map(function(pair) {
              return '<div class="drawer-figure">' +
                '<div class="readout-key">' + esc(pair[0]) + '</div>' +
                '<div class="readout-value num" style="font-size:15px">' +
                  esc(pair[1]) + '</div>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>' +

        (daily.length > 1
          ? '<div class="drawer-section">' +
              '<div class="drawer-section-title">Recepción diaria</div>' +
              sparkline(
                daily.map(function(point) { return point.total; }),
                PALETTE.brand, 'rgba(36,57,94,.12)'
              ) +
            '</div>'
          : '') +

        (weekly.length
          ? '<div class="drawer-section">' +
              '<div class="drawer-section-title">Semana a semana</div>' +
              '<table class="table" style="font-size:11px">' +
                '<thead><tr><th>Semana</th><th class="n">Plan</th>' +
                '<th class="n">Recibido</th><th class="n">Cumpl.</th></tr></thead>' +
                '<tbody>' + weekly.map(function(entry) {
                  var colors = heatColor(entry.line.compliance);

                  return '<tr>' +
                    '<td>' + esc(entry.week.label) + '</td>' +
                    '<td class="n num">' + fmt(entry.line.plan) + '</td>' +
                    '<td class="n num">' + fmt(entry.line.received) + '</td>' +
                    '<td class="n"><span class="tag" style="background:' +
                      (colors ? colors[0] : PALETTE.sunk) + ';color:' +
                      (colors ? colors[1] : PALETTE.ink2) + '">' +
                      (entry.line.compliance === null
                        ? '—'
                        : Math.round(entry.line.compliance * 100) + '%') +
                    '</span></td>' +
                  '</tr>';
                }).join('') + '</tbody>' +
              '</table>' +
            '</div>'
          : '') +

        (notes.length
          ? '<div class="drawer-section">' +
              '<div class="drawer-section-title">Últimos apuntes</div>' +
              notes.map(function(note) {
                return '<div style="padding:9px 0;border-top:1px solid var(--line)">' +
                  '<div class="readout-key">' + esc(note.week) + ' · ' +
                    esc(note.status) + '</div>' +
                  '<p style="margin-top:4px;font-size:11.5px;line-height:1.55">' +
                    esc(note.action || note.diagnosis) + '</p>' +
                '</div>';
              }).join('') +
            '</div>'
          : '') +

        '<div class="drawer-section">' +
          '<div class="drawer-section-title">Homologación</div>' +
          '<p class="panel-note">' + esc(originsOf(provider)) + '</p>' +
        '</div>' +
      '</div>' +
    '</aside>';

  each('#drawerHost [data-close]', function(node) {
    node.addEventListener('click', closeDrawer);
  });

  renderProviderTable();
}

function originsOf(provider) {
  var names = {};

  (DATA.rows || []).forEach(function(row) {
    if (row.provider === provider && row.providerRaw) {
      names[row.providerRaw] = row.matchMethod;
    }
  });

  var list = Object.keys(names);

  if (!list.length) {
    return 'Solo aparece en la hoja Plan; todavía no registra movimiento.';
  }

  return 'Se consolida desde ' + list.length +
    (list.length === 1 ? ' nombre' : ' nombres') + ': ' +
    list.map(function(name) {
      return name + ' (' + names[name].toLowerCase() + ')';
    }).join('; ') + '.';
}

function closeDrawer() {
  if (!PICKED) { return; }

  PICKED = null;
  id('drawerHost').innerHTML = '';
  renderProviderTable();
}

function clearFilters() {
  id('fFrom').value = DATA.month.startKey || '';
  id('fTo').value = DATA.month.endKey || '';
  id('fProvider').value = '';
  id('fSource').value = '';
  id('fSearch').value = '';
  renderAll();
}

function openSheet() {
  var url = DATA && DATA.source ? DATA.source.spreadsheetUrl : '';

  if (!url) { return; }

  window.open(url, '_blank');
}

/**
 * Resumen en texto plano, listo para pegar en un correo o en WhatsApp.
 */
function copySummary() {
  var wd = workdays();
  var plan = sum(SUMMARY, 'plan');
  var total = sum(SUMMARY, 'actual') + sum(SUMMARY, 'gmail');
  var planToDate = plan * (wd.fraction || 0);
  var pace = wd.elapsed > 0 ? total / wd.elapsed : 0;
  var projection = pace * wd.total;
  var risk = sum(SUMMARY, 'risk');

  var need = wd.remaining > 0
    ? Math.max(0, plan - total) / wd.remaining
    : 0;

  var lines = [
    'METRORUMA · ' + cap(DATA.month.label) + ' · corte ' + wd.referenceDateLabel,
    'Días hábiles: ' + wd.elapsed + ' de ' + wd.total +
      ' (quedan ' + wd.remaining + ')',
    '',
    'Recibido: ' + fmt(total) + ' MR',
    'Plan a la fecha: ' + fmt(planToDate) + ' MR (' +
      (planToDate > 0 ? pctText(total / planToDate) : 's/plan') + ')',
    'Desvío: ' + signed(total - planToDate) + ' MR',
    'Cierre proyectado: ' + fmt(projection) + ' MR de ' + fmt(plan) + ' MR',
    'MR en riesgo: ' + fmt(risk),
    'Ritmo actual: ' + fmt(pace) + ' MR/día · exigido ' + fmt(need) + ' MR/día',
    ''
  ];

  var attack = SUMMARY
    .filter(function(item) { return item.risk > 0; })
    .slice(0, 5);

  if (attack.length) {
    lines.push('Prioridades:');

    attack.forEach(function(item, index) {
      lines.push(
        (index + 1) + '. ' + item.provider + ': ' + fmt(item.risk) +
        ' MR en riesgo, proyecta ' + fmt(item.projection) + ' de ' +
        fmt(item.plan) + ' MR' +
        (item.idleDays >= 3
          ? ' (sin recibir hace ' + item.idleDays + ' días)' : '')
      );
    });
  } else {
    lines.push('Sin proveedores en riesgo de cierre bajo plan.');
  }

  copyText(lines.join('\n'), 'Resumen copiado. Pégalo donde lo necesites.');
}

function copyProviderTable() {
  var head = [
    'Proveedor', 'Plan mes', 'Plan a la fecha', 'Real', 'Gmail', 'Total',
    'Desvío', 'Cumpl. a la fecha', 'Proyección', 'MR en riesgo',
    'Días sin recibir', 'Clasificación'
  ];

  var body = SUMMARY.map(function(item) {
    return [
      item.provider,
      dec(item.plan), dec(item.planToDate), dec(item.actual),
      dec(item.gmail), dec(item.total), dec(item.gapToDate),
      item.complianceToDate === null ? '' : dec(item.complianceToDate * 100),
      dec(item.projection), dec(item.risk),
      item.plan > 0 ? item.idleDays : '',
      BAND_LABEL[item.band] || ''
    ].join('\t');
  });

  copyText(
    [head.join('\t')].concat(body).join('\n'),
    'Tabla copiada. Pégala directamente en una hoja de cálculo.'
  );
}

function copyText(text, message) {
  var area = document.createElement('textarea');

  area.value = text;
  area.setAttribute('readonly', 'readonly');
  area.style.position = 'fixed';
  area.style.top = '-1000px';
  document.body.appendChild(area);
  area.select();

  var done = false;

  try {
    done = document.execCommand('copy');
  } catch (error) {
    done = false;
  }

  document.body.removeChild(area);
  toast(done ? message : 'El navegador bloqueó el portapapeles.');
}

function toast(message) {
  var node = id('tooltip');

  node.innerHTML = '<div class="tooltip-title">' + esc(message) + '</div>';
  node.style.left = '50%';
  node.style.top = 'auto';
  node.style.bottom = '22px';
  node.style.transform = 'translateX(-50%)';
  node.classList.add('is-on');

  clearTimeout(toast.timer);

  toast.timer = setTimeout(function() {
    node.classList.remove('is-on');
    node.style.bottom = '';
    node.style.transform = '';
  }, 2600);
}

/* =====================================================================
 * ESTADO Y UTILIDADES
 * ===================================================================== */

function setBusy(on, quiet) {
  BUSY = on;

  id('btnReload').classList.toggle('is-busy', on);
  id('btnSaveAll').disabled = on;
  id('btnDraft').disabled = on;

  if (!quiet) { id('veil').hidden = !on; }
}

function step(text) {
  var node = id('veilStep');
  if (node) { node.textContent = text; }
}

function showError(message) {
  id('bannerErrorText').textContent = String(message);
  show('bannerError');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function id(name) { return document.getElementById(name); }
function all(selector, root) { return (root || document).querySelectorAll(selector); }

function each(selector, fn, root) {
  Array.prototype.forEach.call(all(selector, root), fn);
}

function show(name) { id(name).hidden = false; }
function hide(name) { id(name).hidden = true; }

function fillSelect(name, options, firstLabel) {
  var select = id(name);
  var html = firstLabel
    ? '<option value="">' + esc(firstLabel) + '</option>'
    : '';

  html += options.map(function(option) {
    return '<option value="' + esc(option.value) + '">' +
      esc(option.label) + '</option>';
  }).join('');

  select.innerHTML = html;
}

function dateInput(name) {
  var value = String(id(name).value || '').trim();
  return /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : '';
}

function esc(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmt(value) {
  var number = Number(value) || 0;

  return new Intl.NumberFormat('es-CL', {
    minimumFractionDigits: 0,
    maximumFractionDigits: Math.abs(number) >= 100 ? 0 : 1
  }).format(number);
}

function fmtInt(value) {
  return new Intl.NumberFormat('es-CL', {
    maximumFractionDigits: 0
  }).format(Number(value) || 0);
}

function dec(value) {
  return String(round(Number(value) || 0, 2)).replace('.', ',');
}

function signed(value, digits) {
  var number = Number(value) || 0;
  var text = digits === 0
    ? String(Math.round(number))
    : fmt(number);

  return (number > 0 ? '+' : '') + text;
}

function pctText(value) {
  return new Intl.NumberFormat('es-CL', {
    style: 'percent',
    minimumFractionDigits: 0,
    maximumFractionDigits: 1
  }).format(Number(value) || 0);
}

function dmy(key) {
  var match = String(key || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match ? match[3] + '/' + match[2] + '/' + match[1] : '';
}

function isoWeek(dateKey) {
  var parts = String(dateKey).split('-');
  var date = new Date(Date.UTC(
    Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])
  ));

  var day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);

  var start = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  var week = Math.ceil(((date - start) / 86400000 + 1) / 7);

  return date.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}

function weekLabel(start, end) {
  var a = String(start).split('-');
  var b = String(end).split('-');

  return a[2] + '/' + a[1] + ' – ' + b[2] + '/' + b[1];
}

function norm(value) {
  return String(value || '')
    .trim()
    .toUpperCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ');
}

function uniq(values) {
  return Array.prototype.filter.call(values, uniqFilter());
}

function uniqFilter() {
  var seen = {};

  return function(value) {
    if (seen[value]) { return false; }
    seen[value] = true;
    return true;
  };
}

function sum(list, key) {
  return list.reduce(function(total, item) {
    return total + (Number(item[key]) || 0);
  }, 0);
}

function round(value, digits) {
  var factor = Math.pow(10, digits === undefined ? 1 : digits);
  return Math.round((Number(value) || 0) * factor) / factor;
}

function clip(value, max) {
  var text = String(value || '');
  return text.length > max ? text.slice(0, max - 1) + '…' : text;
}

function cap(value) {
  var text = String(value || '');
  return text ? text.charAt(0).toUpperCase() + text.slice(1) : '';
}

function pad2(value) {
  return String(value).padStart(2, '0');
}

function debounce(fn, wait) {
  var timer = null;

  return function() {
    var context = this;
    var args = arguments;

    clearTimeout(timer);
    timer = setTimeout(function() { fn.apply(context, args); }, wait);
  };
}
